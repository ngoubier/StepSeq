<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StepSeq</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-group">
      <span class="brand" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="5" height="5" rx="1"/><rect x="9.5" y="4" width="5" height="5" rx="1" opacity=".35"/><rect x="17" y="4" width="5" height="5" rx="1"/><rect x="2" y="15" width="5" height="5" rx="1" opacity=".35"/><rect x="9.5" y="15" width="5" height="5" rx="1"/><rect x="17" y="15" width="5" height="5" rx="1" opacity=".35"/></svg>
      </span>
      <input id="title" class="title-input" type="text" spellcheck="false" aria-label="Titre du projet">
    </div>

    <div class="topbar-group">
      <label class="field">
        <span>Tempo</span>
        <input id="tempo" type="number" min="20" max="300" step="1">
        <small>BPM</small>
      </label>
      <label class="field">
        <span>Mesure</span>
        <select id="sigNum" aria-label="Temps par mesure"></select>
        <b>/</b>
        <select id="sigDen" aria-label="Unité de temps">
          <option value="4">4</option>
          <option value="8">8</option>
        </select>
      </label>
      <label class="field">
        <span>Mesures</span>
        <select id="bars">
          <option>1</option><option>2</option><option>3</option><option>4</option><option>8</option>
        </select>
      </label>
    </div>

    <div class="topbar-group transport">
      <button id="addTrack" class="btn btn-icon" title="Ajouter une piste">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="play" class="btn btn-icon btn-play" title="Lecture (Espace)">
        <svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" class="fill"/></svg>
      </button>
      <button id="stop" class="btn btn-icon" title="Stop (Espace)">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" class="fill"/></svg>
      </button>
      <div class="lcd" aria-live="off">
        <div id="position">1 . 1 . 1</div>
        <div id="lcdTitle" class="lcd-sub"></div>
      </div>
    </div>

    <div class="topbar-group files">
      <button id="newProject" class="btn" title="Nouveau projet">Nouveau</button>
      <button id="openProject" class="btn" title="Ouvrir un fichier projet">Ouvrir</button>
      <button id="saveProject" class="btn btn-accent" title="Enregistrer (Ctrl+S)">Enregistrer</button>
    </div>
  </header>

  <main id="workspace">
    <div id="ruler" class="ruler"></div>
    <div id="tracks"></div>
    <div id="empty" class="empty">
      <p>Aucune piste pour l'instant.</p>
      <button id="emptyAdd" class="btn btn-accent">+ Ajouter une piste</button>
    </div>
  </main>

  <footer class="bottombar">
    <div class="hint">Espace : lecture / stop · Ctrl+S : enregistrer · Glisser pour peindre des pas</div>
    <div class="segmented" id="editMode" role="radiogroup" aria-label="Mode d'édition">
      <button data-mode="toggle" class="active">On/Off</button>
      <button data-mode="velocity">Vélocité</button>
    </div>
  </footer>

  <!-- Dialogue d'ajout / modification de piste -->
  <dialog id="trackDialog">
    <form method="dialog" id="trackForm">
      <h2 id="dlgTitle">Nouvelle piste</h2>

      <div class="dlg-row">
        <span class="dlg-label">Type de piste</span>
        <div class="segmented" id="dlgType">
          <button type="button" data-v="drum" class="active">Drum</button>
          <button type="button" data-v="instrument">Instrument</button>
        </div>
      </div>

      <div class="dlg-row">
        <label class="dlg-label" for="dlgName">Nom</label>
        <input id="dlgName" type="text" autocomplete="off">
      </div>

      <div class="dlg-row">
        <span class="dlg-label">Couleur</span>
        <div id="dlgColors" class="swatches"></div>
      </div>

      <section id="dlgDrum">
        <div class="dlg-row">
          <span class="dlg-label">Type de drum</span>
          <div id="dlgDrumTypes" class="chips"></div>
        </div>
        <div class="dlg-row">
          <label class="dlg-label" for="dlgMachine">Boîte à rythmes</label>
          <select id="dlgMachine"></select>
        </div>
        <div class="dlg-row">
          <label class="dlg-label" for="dlgVariant">Variation</label>
          <select id="dlgVariant"></select>
        </div>
      </section>

      <section id="dlgInst" hidden>
        <div class="dlg-row">
          <span class="dlg-label">Catégorie</span>
          <div class="segmented" id="dlgCategory"></div>
        </div>
        <div class="dlg-row">
          <span class="dlg-label">Famille</span>
          <div id="dlgFamilies" class="chips"></div>
        </div>
        <div class="dlg-row">
          <label class="dlg-label" for="dlgInstrument">Instrument</label>
          <select id="dlgInstrument" size="7"></select>
        </div>
      </section>

      <div class="dlg-footer">
        <button type="button" id="dlgPreview" class="btn">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" class="fill"/><path d="M16 8.5a5 5 0 0 1 0 7"/></svg>
          Écouter
        </button>
        <span class="spacer"></span>
        <button type="button" id="dlgCancel" class="btn">Annuler</button>
        <button type="submit" id="dlgOk" class="btn btn-accent">Valider</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status"></div>

  <script src="js/sounds.js"></script>
  <script src="js/project.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
