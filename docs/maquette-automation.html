<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Automation par scène</title>
<style>
/* Assistant « Nouvelle chanson » : un onglet par instrument, le type (Drums, Basse, Accords, Arpèges, Mélodie) choisit l'éditeur. */
:root {
  color-scheme: dark;
  --bg: #121215; --panel: #1b1b20; --panel2: #232329; --raise: #2c2c34; --line: #36363f; --line2: #4a4a55;
  --text: #ececf1; --muted: #9c9ca8; --dim: #6a6a76; --accent: #3b8eea; --gold: #c9a227;
  --drums: #e3179c; --bass: #3fcf3f; --pad: #4f6bff; --arp: #13c2a3; --lead: #9b5cff; --master: #d0d0da;
  --ok: #3fcf8e; --warn: #f5c400; --hot: #ff5c5c;
  --r-ctl: 6px; --r-card: 10px; --h: 30px; --h-sm: 26px;
  --f: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--f); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* bandeau principal */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: #1f1f24; border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.logo { width: 40px; height: 40px; border-radius: 9px; background: #23232a; display: grid; place-items: center; flex: none; }
.ptitle { font-size: 19px; font-weight: 700; min-width: 0; }
.tbox { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; letter-spacing: .06em; }
.tbox input { width: 64px; height: 30px; background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--r-ctl); text-align: center; color: var(--text); font-size: 14px; }
.play { width: 64px; height: 44px; border-radius: 8px; border: 0; background: #2ea44f; color: #fff; display: grid; place-items: center; }
.play.on { background: #1f7a3a; }
.stopb { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel2); display: grid; place-items: center; }
.pos { min-width: 130px; padding: 4px 14px; border-radius: 8px; background: #0f1830; text-align: center; color: #6aa9ff; font: 600 18px/1.1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .15em; }
.pos small { display: block; font: 12px var(--f); letter-spacing: 0; color: #9db8e8; }
.keybox { padding: 4px 12px; border: 1px solid var(--line2); border-radius: 8px; background: var(--panel2); }
.keybox small { display: block; font-size: 9px; letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }
.keybox b { font-size: 15px; }
.spacer { flex: 1; }
.ghost { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel2); color: var(--muted); }


.body { display: grid; grid-template-columns: 216px 200px minmax(0, 1fr); gap: 16px; padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.body.noscene { grid-template-columns: 216px minmax(0, 1fr); }
.body.noscene .scenes { display: none; }
.steps { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.steps h6 { margin: 10px 8px 4px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.steps h6:first-child { margin-top: 0; }
.st { display: grid; grid-template-columns: 26px 1fr; gap: 0 10px; align-items: center; padding: 6px 8px; border-radius: 8px; border: 1px solid transparent; background: none; text-align: left; width: 100%; }
.st:hover { background: var(--panel); }
.st i { grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; border: 1px solid var(--line2); color: var(--muted); }
.st.inst i { border-color: var(--c); color: var(--c); }
.st.cur { background: var(--panel2); border-color: var(--line2); }
.st.cur i { background: var(--accent); border-color: var(--accent); color: #fff; }
.st.inst.cur i { background: var(--c); border-color: var(--c); color: #0b0b0e; }
.st b { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
.st b .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.st b .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st > span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st.gold i { border-color: var(--gold); color: var(--gold); }
.st.gold.cur i { background: var(--gold); color: #0b0b0e; }

.scenes { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.sc { text-align: left; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.sc:hover { background: var(--panel2); }
.sc.cur { background: var(--panel2); box-shadow: inset 0 0 0 1px var(--c); }
.sc b { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
.sc b small { font-weight: 500; color: var(--dim); }
.sc span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc span.mute { color: var(--warn); }

.main { min-width: 0; display: flex; flex-direction: column; gap: 14px; --c: var(--accent); }
.head h1 { margin: 0; font-size: 22px; } .head h1 em { font-style: normal; color: var(--dim); margin-right: 8px; }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 80ch; }
.btn { height: var(--h); padding: 0 12px; border-radius: var(--r-ctl); border: 1px solid var(--line2); background: var(--panel2); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.btn:hover { background: var(--raise); }
.btn.sm { height: var(--h-sm); padding: 0 8px; font-size: 12px; }
.btn.pri { background: color-mix(in srgb, var(--c) 30%, var(--panel2)); border-color: var(--c); }
.btn.on { background: #6b4b00; border-color: var(--warn); color: var(--warn); }
.btn.s.on { background: #0f3a5a; border-color: var(--accent); color: #9ccaff; }
.btn.gold { border-color: var(--gold); color: var(--gold); }

/* sélecteur de type */
.types { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.ty { text-align: left; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--tc); border-radius: var(--r-card); padding: 8px 10px; display: grid; grid-template-columns: 30px 1fr; gap: 0 8px; align-items: center; }
.ty:hover { background: var(--panel2); }
.ty svg { grid-row: span 2; width: 30px; height: 30px; color: var(--tc); }
.ty b { font-size: 13.5px; }
.ty small { grid-column: 2; font-size: 11px; color: var(--muted); line-height: 1.3; }
.ty.on { background: color-mix(in srgb, var(--tc) 16%, var(--panel)); box-shadow: inset 0 0 0 1px var(--tc); }
.tnote { margin: 0; font-size: 12.5px; padding: 6px 10px; border-radius: 8px; border: 1px dashed var(--c); color: var(--text); background: color-mix(in srgb, var(--c) 10%, transparent); }

.trackbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: var(--r-card); padding: 8px 12px; }
.trackbar .who { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.trackbar .who i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.trackbar p { margin: 0; flex: 1 1 200px; color: var(--muted); font-size: 12.5px; }

.editor { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: var(--r-card); padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.editor.muted > :not(.mutedmsg) { opacity: .35; pointer-events: none; }
.mutedmsg { display: none; color: var(--warn); font-size: 13px; }
.editor.muted .mutedmsg { display: block; }
.editor h3 { margin: 0; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.editor h3 small { color: var(--dim); font-weight: 500; }
.sect { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.card { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.card:hover { background: var(--raise); }
.card.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, var(--panel2)); }
.card b { font-size: 12.5px; display: flex; justify-content: space-between; gap: 6px; }
.card b small { color: var(--dim); font-weight: 500; }
.card span { font-size: 11px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: var(--h-sm); padding: 0 10px; border-radius: 999px; border: 1px solid var(--line2); background: var(--panel2); font-size: 12px; }
.chip:hover { background: var(--raise); }
.chip.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 22%, var(--panel2)); }
.knobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.k { display: flex; flex-direction: column; gap: 3px; }
.k label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.k label b { color: var(--text); font-variant-numeric: tabular-nums; }
.k input { width: 100%; accent-color: var(--c); }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.hint { margin: 0; font-size: 12px; color: var(--dim); }
.status { font-size: 12.5px; color: var(--muted); }
.status b { color: var(--c); }

/* étapes simples */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px; }
.inst-row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 12px; background: var(--panel2); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: var(--r-card); }
.inst-row .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.inst-row .nm { font-weight: 700; } .inst-row .nm small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 20%, var(--panel2)); font-size: 12.5px; font-weight: 600; }
.tag::after { content: "▾"; font-size: 10px; color: var(--muted); }
.inst-pick { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; }
.inst-pick .chip { border-color: var(--tc); }
.inst-pick .chip.on { background: color-mix(in srgb, var(--tc) 30%, var(--panel2)); }
.insts { display: flex; flex-direction: column; gap: 8px; }
.chgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.ch { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.ch b { font-size: 15px; } .ch small { color: var(--dim); font-size: 11px; }

@media (max-width: 1100px) { .body { grid-template-columns: 190px 170px minmax(0, 1fr); } .body.noscene { grid-template-columns: 190px minmax(0, 1fr); } .types { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .body, .body.noscene { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .steps { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .steps h6 { display: none; }
  .st { flex: none; width: auto; max-width: 190px; }
  .st > span { display: none; }
  .st i { grid-row: auto; } .st { grid-template-columns: 26px auto; }
  .scenes { flex-direction: row; overflow-x: auto; } .scenes .lbl { display: none; } .sc { flex: none; width: 140px; }
}
@media (max-width: 720px) {
  .tbox, .ghost, .keybox small { display: none; }
  .row2 { grid-template-columns: minmax(0, 1fr); }
  .types { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
/* ---- Accents de basse ---- */
.rollhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.rollhead h2 { margin: 0; font-size: 19px; } .rollhead small { color: var(--muted); font-size: 13px; }
.sel { height: var(--h); background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--r-ctl); padding: 0 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line2); background: var(--panel2); font-size: 12.5px; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc, var(--dim)); }
.pill.off { opacity: .6; }
.lbl2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.roll { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; position: relative; }
.scr { overflow-x: auto; }
.rollin { min-width: 620px; padding: 0 0 4px; position: relative; --cols: 32; }
.chordrow { display: grid; grid-template-columns: repeat(32, minmax(0, 1fr)); height: 30px; border-bottom: 1px solid var(--line); }
.chordrow b { grid-column: var(--s) / span var(--l); border-left: 1px solid var(--line2); border-bottom: 3px solid var(--cc); padding: 5px 6px 0; font-size: 13px; white-space: nowrap; overflow: hidden; }
.chordrow b.bar { border-left-color: #6a6a78; }
.notes { position: relative; margin: 0; background:
  repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / 8 - 1px), rgba(255,255,255,.07) calc(100% / 8 - 1px), rgba(255,255,255,.07) calc(100% / 8)),
  repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / 32 - 1px), rgba(255,255,255,.035) calc(100% / 32 - 1px), rgba(255,255,255,.035) calc(100% / 32)); }
.notes::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: #6a6a78; pointer-events: none; }
.rowbg { position: absolute; left: 0; right: 0; height: var(--rh); border-bottom: 1px solid rgba(255,255,255,.04); }
.rowbg.blk { background: rgba(255,255,255,.025); }
.rowbg span { position: absolute; left: 4px; top: 0; font-size: 9px; line-height: var(--rh); color: var(--dim); }
.nt { position: absolute; height: calc(var(--rh) - 3px); margin-top: 1px; border: 0; padding: 0; border-radius: 3px; background: color-mix(in srgb, var(--bass) 52%, #15301a); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bass) 60%, transparent); transition: background .12s, box-shadow .12s; min-width: 4px; }
.nt:hover { background: color-mix(in srgb, var(--bass) 75%, #15301a); }
.nt.ac { background: #9dff8f; box-shadow: 0 0 0 1px #e8ffe2, 0 0 9px 1px color-mix(in srgb, var(--bass) 80%, transparent); z-index: 2; }
.nt.ac::before { content: ""; position: absolute; left: 50%; top: -11px; width: 7px; height: 7px; border-top: 2px solid #d9ffd2; border-right: 2px solid #d9ffd2; transform: translateX(-70%) rotate(45deg); }
.nt.ac::after { content: ""; position: absolute; inset: 0; }
.accrow { border-top: 1px solid var(--line); padding: 8px 0 6px; }
.accrow .cap { display: flex; justify-content: space-between; gap: 8px; padding: 0 10px 6px; font-size: 12px; color: var(--muted); }
.accrow .cap b { color: var(--text); }
.cells { display: grid; grid-template-columns: repeat(32, minmax(0, 1fr)); }
.cell { height: 30px; border: 0; background: none; padding: 0; display: grid; place-items: center; border-left: 1px solid rgba(255,255,255,.05); position: relative; }
.cell:nth-child(4n+1) { border-left-color: rgba(255,255,255,.16); }
.cell:nth-child(16n+1) { border-left-color: #6a6a78; }
.cell:hover:not(:disabled) { background: rgba(255,255,255,.07); }
.cell:disabled { cursor: default; }
.cell .d { width: 11px; height: 11px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--bass) 70%, #000); box-sizing: border-box; }
.cell.ac .d { background: #9dff8f; border-color: #e8ffe2; box-shadow: 0 0 8px color-mix(in srgb, var(--bass) 80%, transparent); width: 13px; height: 13px; }
.cell.nonote .d { width: 3px; height: 3px; border: 0; background: var(--line2); }
.cell.echo { background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(255,255,255,.04) 4px 8px); }
.beats { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); font-size: 10px; color: var(--dim); }
.beats span { padding-left: 4px; border-left: 1px solid rgba(255,255,255,.16); } .beats span:first-child, .beats span:nth-child(5) { border-left-color: #6a6a78; }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; opacity: .0; z-index: 3; pointer-events: none; }
.playing .playhead { opacity: .8; animation: sweep 3.6s linear infinite; }
@keyframes sweep { from { left: 0; } to { left: 100%; } }
.repeat { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: var(--r-ctl); overflow: hidden; }
.seg button { height: var(--h-sm); padding: 0 10px; border: 0; border-right: 1px solid var(--line2); background: var(--panel2); font-size: 12px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: color-mix(in srgb, var(--bass) 28%, var(--panel2)); color: #fff; box-shadow: inset 0 -2px 0 var(--bass); }
.warn { color: var(--warn); }
.cardx { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cardx h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cardx h3 small { font-weight: 500; color: var(--dim); font-size: 12px; }
.cardx h3 .grow { flex: 1; }
.checkl { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; }
.checkl input { width: 16px; height: 16px; accent-color: var(--bass); }
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.mode { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mode:hover { background: var(--raise); }
.mode.on { border-color: var(--bass); background: color-mix(in srgb, var(--bass) 16%, var(--panel2)); }
.mode b { font-size: 12.5px; } .mode span { font-size: 11px; color: var(--muted); }
.mode svg { width: 100%; height: 22px; display: block; }
.accgrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; }
.pats { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 6px; }
.pat { border-radius: 999px; border-radius: 10px; text-align: left; background: var(--panel2); border: 1px solid var(--line2); padding: 6px 10px 5px; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; min-width: 0; }
.pat:hover { background: var(--raise); }
.pat.on { border-color: var(--bass); background: color-mix(in srgb, var(--bass) 20%, var(--panel2)); }
.pat svg { width: 100%; height: 16px; display: block; }
.pat small { color: var(--dim); font-size: 10.5px; }
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ctl { display: flex; align-items: center; gap: 12px; }
.ctl .txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; font-size: 13px; }
.ctl .txt b { font-size: 13px; } .ctl .txt small { color: var(--muted); font-size: 11.5px; }
.knob { width: 58px; height: 58px; flex: none; border-radius: 50%; touch-action: none; cursor: ns-resize; }
.knob.s { width: 44px; height: 44px; }
.knob svg { width: 100%; height: 100%; display: block; }
.knob:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw { width: 44px; height: 24px; border-radius: 999px; border: 1px solid var(--line2); background: var(--panel2); position: relative; flex: none; padding: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.sw[aria-checked="true"] { background: color-mix(in srgb, var(--bass) 35%, var(--panel2)); border-color: var(--bass); }
.sw[aria-checked="true"]::after { transform: translateX(20px); background: #9dff8f; }
.filt { display: flex; flex-direction: column; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); }
.filt .sub { padding-top: 10px; border-top: 1px dashed var(--line2); }
.sc .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }

<!--

  Raison : c'est la seule position où les courbes restent à l'écran en même temps que les mesures du piano-roll
  (les cartes Mode de jeu + Accents font ~550 px de haut : après elles, on ne verrait plus les notes en réglant une courbe).
  Les deux cadres (piano-roll et carte) ont le même défilement horizontal synchronisé, la même échelle (160 px / mesure)
  et les mêmes numéros de mesures, donc une courbe tombe exactement sous les notes qu'elle module.
-->
<div class="body" id="body">

      <p style="display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center"><span class="tag" style="--c:var(--bass)">Basse</span>Règle ce que joue cet instrument, scène par scène.</p></div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const BW = 112, U = BW / 16;               /* 112 px par mesure, 7 px par pas (16 pas / mesure) */
const ROOT = { Cm: 36, Gm: 31, 'A♭': 32, Fm: 29, 'E♭': 27, 'B♭': 34, G: 31 };
const CC = { Cm: '#3fcf3f', Gm: '#ff5c5c', 'A♭': '#f5c400', Fm: '#4f6bff', 'E♭': '#13c2a3', 'B♭': '#9b5cff', G: '#f08a00' };
const NN = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
const every = (st, l, f = () => 0) => Array.from({ length: 16 / st }, (_, i) => [i * st, l, f(i)]);
const MODES = [
  ['whole', 'Tenue', 'Une note par accord, tenue', [[0, 16, 0]]],
  ['half', 'Blanches', 'Deux attaques par mesure', every(8, 8)],
  ['quarter', 'Noires', 'Sur chaque temps', every(4, 3)],
  ['8', 'Croches', 'Le moteur synthwave', every(2, 2)],
  ['gallop', 'Galop', 'La cavalcade 80s', [0, 4, 8, 12].flatMap((s) => [[s, 2, 0], [s + 2, 1, 0], [s + 3, 1, 0]])],
  ['offbeat', 'Contretemps', 'Entre les kicks : house', every(4, 2).map(([s, l, v]) => [s + 2, l, v])],
  ['rootfifth', 'Fondamentale-quinte', 'Croches alternées', every(2, 2, (i) => i % 2)],
  ['pulse8', 'Croches piquées', 'Huit croches courtes', every(2, 1)],
];

/* ---------- paramètres d'automation (SS.AUTO_PARAMS) ---------- */
const sgn = (v) => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(2).replace('.', ',');
const pct = (v) => Math.round(v * 100) + ' %';
const PARAMS = {
  cutoff: { n: 'Cutoff', menu: 'Cutoff (Filtre)', sub: 'filtre de la piste', c: '#ff9a2e', min: -1, max: 1, fmt: sgn },
  reso:   { n: 'Résonance', c: '#ff6b8b', min: 0, max: 1, fmt: pct },
  vel:    { n: 'Vélocité', sub: 'module les notes de la scène', c: '#3fcf3f', min: 30, max: 127, fmt: (v) => 'vél. ' + Math.round(v), note: true },
  vol:    { n: 'Volume', c: '#b4b4c2', min: 0, max: 1, fmt: pct },
  rev:    { n: 'Reverb', c: '#4f8cff', min: 0, max: 1, fmt: pct },
  echo:   { n: 'Écho', c: '#33b5ff', min: 0, max: 1, fmt: pct },
  cosmos: { n: 'Cosmos', sub: 'reverb longue', c: '#7b83ff', min: 0, max: 1, fmt: pct },
  vcf:    { n: 'Cutoff du son', sub: 'filtre de la voix', c: '#ffd23f', min: 0, max: 1, fmt: pct, synth: true },
  decay:  { n: 'Decay du filtre', c: '#d9a066', min: 0, max: 1, fmt: pct, synth: true },
  lfo:    { n: 'Quantité des LFO', c: '#e879c8', min: 0, max: 1, fmt: pct, synth: true },
};
const PORDER = ['cutoff', 'reso', 'vel', 'vol', 'rev', 'echo', 'cosmos', 'vcf', 'decay', 'lfo'];
const real = (p, n) => PARAMS[p].min + n * (PARAMS[p].max - PARAMS[p].min);

/* ---------- formes prêtes : points [x 0..1 de la scène, n 0..1] avec rampes ---------- */
const SHAPES = [
  { id: 'flat', n: 'Plate', l1: 'Niveau', a: .5, b: .5 },
  { id: 'rise', n: 'Montée', l1: 'Début', l2: 'Fin', a: .2, b: .7 },
  { id: 'fall', n: 'Descente', l1: 'Début', l2: 'Fin', a: .7, b: .2 },
  { id: 'open', n: 'Ouvre puis ferme', l1: 'Bords', l2: 'Sommet', a: .2, b: .8 },
  { id: 'close', n: 'Ferme puis ouvre', l1: 'Bords', l2: 'Creux', a: .8, b: .2 },
  { id: 'lfo', n: 'LFO lent', l1: 'Profondeur', l2: 'Centre', a: .4, b: .5, per: 2 },
  { id: 'steps', n: 'Marches', l1: 'Début', l2: 'Fin', a: .2, b: .8 },
  { id: 'final', n: 'Montée finale', l1: 'Niveau', l2: 'Sommet', a: .3, b: .9 },
  { id: 'breath', n: 'Respiration', l1: 'Bas', l2: 'Haut', a: .3, b: .8 },
];
const SH = (id) => SHAPES.find((s) => s.id === id);
const r3 = (v) => Math.round(v * 1000) / 1000;
const cl = (v) => Math.max(0, Math.min(1, v));
function gen(sh, a, b, per, bars) {
  let p = [];
  if (sh === 'flat') p = [[0, a], [1, a]];
  else if (sh === 'rise' || sh === 'fall') p = [[0, a], [1, b]];
  else if (sh === 'open' || sh === 'close') p = [[0, a], [.5, b], [1, a]];
  else if (sh === 'lfo') { const N = Math.round(bars / per * 8); for (let i = 0; i <= N; i++) p.push([i / N, cl(b + a / 2 * Math.sin(2 * Math.PI * i / 8))]); }
  else if (sh === 'breath') { const N = Math.round(bars / 2 * 8); for (let i = 0; i <= N; i++) p.push([i / N, a + (b - a) * (.5 - .5 * Math.cos(2 * Math.PI * i / 8))]); }
  else if (sh === 'steps') for (let i = 0; i < bars; i++) { const v = a + (b - a) * i / (bars - 1); p.push([i / bars, v], [(i + 1) / bars - .0004, v]); }
  else if (sh === 'final') p = [[0, a], [(bars - 2) / bars, a], [1, b]];
  p = p.map(([x, y]) => [r3(x), r3(cl(y))]); p[0][0] = 0; p[p.length - 1][0] = 1;
  return p;
}
const lineOf = (param, shape, over = {}, bars = 16) => {
  const d = SH(shape), g = { shape, a: d.a, b: d.b, per: d.per || 2, ...over };
  return { p: param, shape, g, hidden: false, pts: gen(g.shape, g.a, g.b, g.per, bars) };
};

const P = (s) => s.split(' ');
const SCENES = [
  { id: 'intro', n: 'Intro', c: '#6b7fa6', prog: P('Cm Cm Cm B♭ B♭ A♭ A♭ A♭'), mode: 'whole' },
  { id: 'verse', n: 'Couplet', c: '#2b8cff', prog: P('Cm Gm A♭ Fm Cm Gm E♭ B♭ Cm Gm A♭ Fm Cm Gm E♭ B♭'), mode: '8' },
  { id: 'chorus', n: 'Refrain', c: '#e3179c', prog: P('A♭ B♭ E♭ Cm A♭ B♭ E♭ Cm'), mode: 'gallop' },
  { id: 'bridge', n: 'Pont', c: '#f08a00', prog: P('Fm Fm Cm Cm G G G G'), mode: 'quarter' },
  { id: 'outro', n: 'Outro', c: '#6b7fa6', prog: P('Cm Cm Cm B♭ B♭ A♭ A♭ A♭'), mode: 'whole' },
];
/* accents : un motif de 16 pas repris à chaque mesure */
const PATS = [
  ['none', 'Aucun', '', () => false],
  ['strong', 'Temps forts', '1 et 3', (s) => s === 0 || s === 8],
  ['beat', 'Chaque temps', '', (s) => s % 4 === 0],
  ['off', 'Contretemps', 'les « et »', (s) => s % 4 === 2],
  ['gallop', 'Galop', '1re de chaque groupe', (s) => s % 4 === 0],
  ['sync', 'Synco 3-3-2', '', (s) => [0, 6, 12].includes(s)],
  ['rand', 'Aléatoire léger', 'un nouveau tirage', null],
];
const mk = (f) => Array.from({ length: 16 }, (_, s) => !!f(s));
SCENES.forEach((s) => { s.bars = s.prog.length; s.play = true; s.force = 75; s.open = false; s.bright = 60; s.pat = 'none'; s.acc = mk(() => false); s.auto = []; });
SCENES[1].pat = 'strong'; SCENES[1].acc = mk(PATS[1][3]); SCENES[1].open = true;
SCENES[2].pat = 'beat'; SCENES[2].acc = mk(PATS[2][3]);
SCENES[3].pat = 'off'; SCENES[3].acc = mk(PATS[3][3]);
/* automation par scène : Couplet = Cutoff « Montée » + Vélocité « Respiration », Intro = Cutoff « Ouvre puis ferme », Refrain = rien */
SCENES[0].auto = [lineOf('cutoff', 'open', { a: .25, b: .85 }, 8)]; SCENES[0].auto[0].hidden = true;
SCENES[1].auto = [lineOf('cutoff', 'rise', { a: .2, b: .7 }, 16), lineOf('vel', 'breath', { a: .52, b: .85 }, 16)]; SCENES[1].auto[1].hidden = true;

const S = { sc: 1, playing: false, t: 0, menu: false, sl: 0, synth: true };
const cur = () => SCENES[S.sc];
const mode = (sc) => MODES.find((m) => m[0] === sc.mode);
const lines = (sc) => sc.auto.filter((l) => S.synth || !PARAMS[l.p].synth);

/* notes : motif du mode de jeu répété sur chaque mesure, selon l'accord de la mesure */
function notesOf(sc) {
  if (!sc.play) return [];
  const out = [];
  if (sc.mode === 'whole') {
    let b = 0;
    while (b < sc.bars) { let e = b + 1; while (e < sc.bars && sc.prog[e] === sc.prog[b]) e++; out.push({ b, s: 0, abs: b * 16, l: (e - b) * 16, p: ROOT[sc.prog[b]] }); b = e; }
  } else for (let b = 0; b < sc.bars; b++) mode(sc)[3].forEach(([s, l, v]) => out.push({ b, s, abs: b * 16 + s, l: Math.min(l, 16 - s), p: ROOT[sc.prog[b]] + [0, 7, 12][v] }));
  return out;
}
const hasStep = (sc) => { const a = new Array(16).fill(false); notesOf(sc).forEach((n) => { if (n.s === 0 || n.b === 0) a[n.s] = true; }); return a; };
const count = (sc) => { const h = hasStep(sc); return sc.acc.filter((v, s) => v && h[s]).length; };
const same = (a, b) => a.every((v, s) => v === b[s]);
function detect(sc) { const f = PATS.find((p) => p[3] && same(sc.acc, mk(p[3]))); sc.pat = f ? f[0] : 'custom'; }
function applyPat(id) {
  const sc = cur(), p = PATS.find((x) => x[0] === id);
  if (id === 'rand') { const h = hasStep(sc); sc.acc = mk((s) => h[s] && Math.random() < 0.22); sc.pat = 'rand'; } else { sc.acc = mk(p[3]); sc.pat = id; }
}
function toggle(s) { const sc = cur(); sc.acc[s] = !sc.acc[s]; detect(sc); }

/* évaluation d'une courbe (interpolation linéaire entre points) */
function evalN(pts, x) {
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; return x1 === x0 ? y1 : y0 + (y1 - y0) * (x - x0) / (x1 - x0); }
  return pts[pts.length - 1][1];
}

/* ---------- dessins ---------- */
function patSvg(p) {
  let h = '';
  const acc = p[3] ? mk(p[3]) : [true, false, false, false, false, false, true, false, false, true, false, false, false, false, false, false];
  for (let s = 0; s < 16; s++) { const x = s * 6 + 1, a = acc[s]; h += `<rect x="${x}" y="${a ? 1 : 9}" width="4" height="${a ? 14 : 6}" rx="1" fill="${a ? '#9dff8f' : 'currentColor'}" opacity="${a ? 1 : .35}"/>`; }
  return `<svg viewBox="0 0 96 16" preserveAspectRatio="none" aria-hidden="true">${h}</svg>`;
}
function modeSvg(m) {
  return `<svg viewBox="0 0 160 22" preserveAspectRatio="none" aria-hidden="true">${m[3].map(([s, l, v]) => `<rect x="${s * 10}" y="${14 - (v === 2 ? 10 : v === 1 ? 5 : 0)}" width="${Math.max(l * 10 - 1.5, 3)}" height="6" rx="1.5" fill="var(--bass)"/>`).join('')}</svg>`;
}
function miniSvg(pts) {
  const d = pts.map(([x, y], i) => `${i ? 'L' : 'M'}${(x * 100).toFixed(1)} ${(14 - y * 12).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 100 15" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
/* ---------- potentiomètre rond ---------- */
function polar(cx, cy, r, deg) { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
function arc(r, a0, a1) { const [x0, y0] = polar(30, 30, r, a0), [x1, y1] = polar(30, 30, r, a1); return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; }
function knobHtml(v) {
  const a = -135 + 270 * v / 100, [x, y] = polar(30, 30, 17, a), [x2, y2] = polar(30, 30, 9, a);
  return `<svg viewBox="0 0 60 60" aria-hidden="true"><path d="${arc(26, -135, 135)}" fill="none" stroke="#3a3a45" stroke-width="4" stroke-linecap="round"/>${v > 0 ? `<path d="${arc(26, -135, a)}" fill="none" stroke="var(--bass)" stroke-width="4" stroke-linecap="round"/>` : ''}<circle cx="30" cy="30" r="19" fill="#2a2a32" stroke="#4a4a55"/><line x1="${x2.toFixed(2)}" y1="${y2.toFixed(2)}" x2="${x.toFixed(2)}" y2="${y.toFixed(2)}" stroke="#eaffe6" stroke-width="3" stroke-linecap="round"/></svg>`;
}
const knob = (key, v, label, small) => `<div class="knob${small ? ' s' : ''}" role="slider" tabindex="0" data-knob="${key}" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}">${knobHtml(v)}</div>`;
const legend = (f) => `+${(f * 0.06).toFixed(1).replace('.0', '')} dB / vélocité ${Math.round(100 + f * 0.27)}`;

/* ---------- rendus ---------- */
const rulerHtml = (bars) => `<div class="rulerrow" style="--bw:${BW}px;width:${bars * BW}px">${Array.from({ length: bars }, (_, i) => `<span>${i + 1}</span>`).join('')}</div>`;
function renderRoll() {
  const sc = cur(), notes = notesOf(sc), has = hasStep(sc), W = sc.bars * BW;
  const vl = lines(sc).find((l) => l.p === 'vel');
  const ps = notes.map((n) => n.p), lo = Math.min(...ps, 27) - 1, hi = Math.max(...ps, 36) + 1, RH = 11, rows = hi - lo + 1;
  let h = `<div class="scr sx"><div class="rollin" style="--rh:${RH}px;--bw:${BW}px;width:${W}px">${rulerHtml(sc.bars)}`;
  h += `<div class="chordrow">${sc.prog.map((c, b) => `<b class="${b % 8 === 0 ? 'bar' : ''}" style="--cc:${CC[c]}">${c}</b>`).join('')}</div>`;
  h += `<div class="notes" style="height:${rows * RH + 14}px"><div class="ph"></div>`;
  for (let p = hi; p >= lo; p--) { const i = hi - p; h += `<div class="rowbg ${[1, 3, 6, 8, 10].includes(p % 12) ? 'blk' : ''}" style="top:${14 + i * RH}px">${p % 12 === 0 ? `<span>C${Math.floor(p / 12) - 1}</span>` : ''}</div>`; }
  notes.forEach((n) => {
    const ac = sc.acc[n.s], op = vl && !ac ? (.45 + .55 * evalN(vl.pts, (n.abs + .5) / (sc.bars * 16))).toFixed(2) : 1;
    h += `<button class="nt${ac ? ' ac' : ''}" data-s="${n.s}" style="left:${n.abs * U}px;width:${n.l * U - 2}px;top:${14 + (hi - n.p) * RH}px;opacity:${op}" aria-pressed="${!!ac}" aria-label="${NN[n.p % 12]}${Math.floor(n.p / 12) - 1}, mesure ${n.b + 1}, pas ${n.s + 1}${ac ? ', accentuée' : ''}"></button>`;
  });
  if (!notes.length) h += `<div style="position:absolute;inset:14px 0 0;display:grid;place-items:center;color:var(--muted)">Pas de notes dans cette scène.</div>`;
  h += `</div><div class="accrow"><div class="cap"><span><b>Accents</b> · un point par note, plein si accentuée · le motif d’une mesure se répète sur toutes les mesures</span><span>${count(sc)} par mesure</span></div><div class="cells" style="--n:${sc.bars * 16};--u:${U}px">`;
  for (let b = 0; b < sc.bars; b++) for (let s = 0; s < 16; s++) {
    const a = sc.acc[s] && has[s];
    h += `<button class="cell${a ? ' ac' : ''}${has[s] ? '' : ' nonote'}${b ? ' echo' : ''}" data-s="${s}" ${has[s] ? '' : 'disabled'} aria-label="Mesure ${b + 1}, pas ${s + 1}${has[s] ? (a ? ', accent' : ', note') : ', pas de note'}" aria-pressed="${a}"><span class="d"></span></button>`;
  }
  h += `</div></div></div></div>`;
  $('roll').innerHTML = h;
}

/* --- carte d'automation --- */
const H = 72, PAD = 8;
function curveSvg(l, bars, h = H, pad = PAD, mini = false) {
  const yOf = (n) => pad + (1 - n) * (h - 2 * pad);
  const W = bars * BW, pts = l.pts, c = PARAMS[l.p].c;
  const path = pts.map(([x, y], i) => `${i ? 'L' : 'M'}${(x * W).toFixed(1)} ${yOf(y).toFixed(1)}`).join('');
  let grid = ''; for (let b = 0; b <= bars; b++) grid += `M${b * BW + .5} 0V${h}`;
  let beats = ''; for (let b = 0; b < bars * 4; b++) if (b % 4) beats += `M${b * BW / 4 + .5} 0V${h}`;
  const dots = mini ? '' : pts.map(([x, y], i) => `<g class="hd" data-i="${i}"><circle r="11" cx="${(x * W).toFixed(1)}" cy="${yOf(y).toFixed(1)}" fill="transparent"/><circle class="dot" r="4.5" cx="${(x * W).toFixed(1)}" cy="${yOf(y).toFixed(1)}"/></g>`).join('');
  return `<path d="${beats}" stroke="rgba(255,255,255,.05)" fill="none"/><path d="${grid}" stroke="#4a4a58" fill="none"/><path d="M0 ${yOf(.5)}H${W}" stroke="rgba(255,255,255,.12)" stroke-dasharray="3 5" fill="none"/>
    <path d="${path}L${W} ${h}L0 ${h}Z" fill="${c}" opacity=".16"/><path d="${path}" fill="none" stroke="${c}" stroke-width="${mini ? 1.8 : 2.4}" stroke-linejoin="round"/>${dots}`;
}
function readout(l) {
  const f = PARAMS[l.p].fmt, rv = (n) => f(real(l.p, n)), ys = l.pts.map((p) => p[1]);
  if (l.shape === 'flat') return rv(ys[0]);
  if (['open', 'close', 'lfo', 'breath'].includes(l.shape)) return `${rv(Math.min(...ys))} ↔ ${rv(Math.max(...ys))}`;
  return `${rv(ys[0])} → ${rv(ys[ys.length - 1])}`;
}
function chipsHtml(l) {
  const drawn = l.shape === 'drawn';
  return SHAPES.map((s) => `<button class="shp${l.shape === s.id ? ' on' : ''}" data-shape="${s.id}" aria-pressed="${l.shape === s.id}">${miniSvg(gen(s.id, s.a, s.b, s.per || 2, cur().bars))}<span>${s.n}</span></button>`).join('')
    + (drawn ? `<button class="shp on drawn" aria-pressed="true" tabindex="-1">${miniSvg(l.pts)}<span>Dessinée</span></button>` : '');
}
function ctlHtml(l) {
  const d = SH(l.g.shape), drawn = l.shape === 'drawn', f = PARAMS[l.p].fmt;
  if (drawn) return `<button class="rev" data-revert>↺ Revenir à la forme « ${d.n} »</button>`;
  const lab = (which) => { const n = l.g[which]; return l.g.shape === 'lfo' && which === 'a' ? pct(n) : f(real(l.p, n)); };
  const sl = (which, name) => `<div class="k"><label>${name}<b data-lab="${which}">${lab(which)}</b></label><input type="range" min="0" max="100" value="${Math.round(l.g[which] * 100)}" data-sl="${which}" aria-label="${name}"></div>`;
  return `${sl('a', d.l1)}${d.l2 ? sl('b', d.l2) : ''}${l.g.shape === 'lfo' ? `<div class="repeat"><span class="lbl2">Période</span><div class="seg lfop">${[1, 2, 4].map((p) => `<button class="${l.g.per === p ? 'on' : ''}" data-per="${p}">${p} mes.</button>`).join('')}</div></div>` : ''}`;
}
const sum = (l) => (l.shape === 'drawn' ? 'Dessinée' : SH(l.shape).n) + ' ' + readout(l);
function renderMenu() {
  const sc = cur(), n = lines(sc).length, vis = lines(sc).filter((l) => !l.hidden).length;
  const items = PORDER.map((k) => {
    const p = PARAMS[k], added = sc.auto.some((l) => l.p === k), off = p.synth && !S.synth;
    return `<button role="menuitemcheckbox" aria-checked="${added}" data-addp="${k}" style="--pc:${p.c}" ${added || off ? 'disabled' : ''}><i></i><span>${added ? '✓ ' : ''}${p.menu || p.n}${p.sub ? ` <small>· ${p.sub}</small>` : ''}</span><small>${added ? 'ajouté' : off ? 'synthés seulement' : p.synth ? 'synthé' : ''}</small></button>`;
  }).join('');
  const menu = S.menu ? `<div class="menu" role="menu"><div class="mh">Ajouter une automation à « ${sc.n} »</div>${items}<div class="mh">Panneaux</div><div class="mrow"><button data-hideall ${vis ? '' : 'disabled'}>Tout masquer</button><button data-showall ${n && vis < n ? '' : 'disabled'}>Tout afficher</button></div></div>` : '';
  $('autow').innerHTML = `<button class="btn" id="addbtn" aria-haspopup="menu" aria-expanded="${S.menu}">Automation${n ? ` · ${n}` : ''} ▾</button>${menu}`;
}
function renderAuto() {
  const sc = cur(), ls = lines(sc), bars = sc.bars, W = bars * BW, el = $('autocard');
  if (!ls.length) { el.innerHTML = ''; el.style.display = 'none'; return; }
  el.style.display = '';
  let h = `<h3>Automation de « ${sc.n} » <small>${bars} mesures · réglée pour cette scène seulement</small></h3>`;
  h += `<div class="bleed sx ruler"><div style="position:relative;width:${W}px">${rulerHtml(bars)}</div></div>`;
  ls.forEach((l) => {
    const c = PARAMS[l.p], i = sc.auto.indexOf(l);
    const live = '<span class="live" data-live></span>';
    if (l.hidden) {
      h += `<section class="ln fold" data-line="${i}" style="--pc:${c.c}"><div class="lh"><button class="xb ch" data-fold aria-expanded="false" aria-label="Afficher la courbe ${c.n}" title="Afficher">▸</button><i class="sq"></i><b>${c.n}</b><span class="rd">${sum(l)}</span>${live}<span class="grow"></span><button class="xb" data-del="${i}" aria-label="Supprimer la courbe ${c.n}" title="Supprimer la courbe">×</button></div>
        <div class="bleed sx lane"><div class="cv" style="width:${W}px;height:30px"><svg width="${W}" height="30" data-mini>${curveSvg(l, bars, 30, 5, true)}</svg><div class="ph"></div></div></div></section>`;
      return;
    }
    h += `<section class="ln" data-line="${i}" style="--pc:${c.c}"><div class="lh"><button class="xb ch" data-fold aria-expanded="true" aria-label="Masquer la courbe ${c.n}" title="Masquer (elle continue de jouer)">▾</button><i class="sq"></i><b>${c.n}</b>${c.sub ? `<span class="sub">${c.sub}</span>` : ''}<span class="rd" data-rd>${readout(l)}</span>${live}<span class="grow"></span><div class="lcn" data-ctl>${ctlHtml(l)}</div><button class="xb" data-del="${i}" aria-label="Supprimer la courbe ${c.n}" title="Supprimer la courbe">×</button></div>
      <div class="shapes" data-meta role="group" aria-label="Formes prêtes">${chipsHtml(l)}</div>
      <div class="bleed sx lane"><div class="cv" style="width:${W}px;height:${H}px"><svg width="${W}" height="${H}" data-cv>${curveSvg(l, bars)}</svg><div class="ph"></div></div></div></section>`;
  });
  if (ls.some((l) => !l.hidden)) h += `<p class="hint">Retouche : glisse un point (haut/bas et gauche/droite) · double-clic pour en ajouter · clic droit ou Alt+clic sur un point pour le supprimer.</p>`;
  el.innerHTML = h;
}
function renderCards() {

    <div class="modes">${MODES.map((x) => `<button class="mode${sc.mode === x[0] ? ' on' : ''}" data-mode="${x[0]}"><b>${x[1]}</b>${modeSvg(x)}<span>${x[2]}</span></button>`).join('')}</div>`;
  const miss = n === 0 && sc.pat !== 'none' && sc.acc.some(Boolean) && sc.play;
  $('acccard').innerHTML = `<h3>Accents <small>des notes plus fortes, pour faire respirer la basse</small><span class="grow"></span><button class="btn sm" data-act="clear">Effacer</button></h3>
    <div class="accgrid"><div class="side"><div class="lbl2">Motifs prêts</div><div class="pats">${PATS.map((p) => `<button class="pat${sc.pat === p[0] ? ' on' : ''}" data-pat="${p[0]}"><b>${p[1]}</b>${patSvg(p)}<small>${p[2] || '&nbsp;'}</small></button>`).join('')}</div>
      <p class="hint ${miss ? 'warn' : ''}">${miss ? `Aucune note du mode « ${m[1]} » ne tombe sur ce motif.` : sc.pat === 'custom' ? 'Motif personnalisé : tu as touché des notes ou des cases à la main.' : 'Choisir un motif remplit la ligne « Accents » sous les notes.'}</p></div>
      <div class="side"><div class="ctl">${knob('force', sc.force, 'Force de l’accent')}<div class="txt"><b>Force <span id="fv">${sc.force}</span></b><small id="fl">${legend(sc.force)}</small></div></div>
        <div class="filt"><div class="ctl"><button class="sw" role="switch" id="opensw" aria-checked="${sc.open}" aria-label="Ouvre le filtre"></button><div class="txt"><b>Ouvre le filtre</b><small>L’accent ouvre le filtre : la basse acide.</small></div></div>
          ${sc.open ? `<div class="ctl sub">${knob('bright', sc.bright, 'Brillance', true)}<div class="txt"><b>Brillance <span id="bv">${sc.bright}</span></b><small>Jusqu’où le filtre s’ouvre.</small></div></div>` : ''}</div></div></div>`;
}
function renderSteps() {
  const sc = cur(), n = count(sc), na = lines(sc).length;
  const base = [['Style', 'Synthwave'], ['Instruments', '5 musiciens'], ['Tempo et tonalité', '132 BPM · Do mineur'], ['Scènes', '5 scènes · 48 mesures'], ['Accords', 'Cm Gm A♭ Fm']];
  const insts = [['Batterie', 'Drums · Inspiration', 'var(--drums)', 6], ['Synth Bass I', `Basse · ${sc.play ? mode(sc)[1] : 'aucune'}${n ? ` · ${n} accent${n > 1 ? 's' : ''}` : ''}${na ? ' · auto' : ''}`, 'var(--bass)', 7], ['Strings III', 'Accords · Montée douce', 'var(--pad)', 8], ['Chorused Bell', 'Arpège · Cloches', 'var(--arp)', 9], ['Flutes', 'Mélodie · inspiration', 'var(--lead)', 10]];
  let h = '<h6>Fondations</h6>' + base.map((b, k) => `<button class="st ${k === 4 ? 'gold' : ''}"><i>${k + 1}</i><b><span class="nm">${b[0]}</span></b><span>${b[1]}</span></button>`).join('');
  h += '<h6>Instruments, scène par scène</h6>' + insts.map((b) => `<button class="st inst ${b[3] === 7 ? 'cur' : ''}" style="--c:${b[2]}"><i>${b[3]}</i><b><span class="dot"></span><span class="nm">${b[0]}</span></b><span>${b[1]}</span></button>`).join('');
  h += '<h6>Finaliser</h6><button class="st"><i>11</i><b><span class="nm">Mix</span></b><span>Mixage automatique</span></button><button class="st"><i>12</i><b><span class="nm">Intégration</span></b><span>10 pistes</span></button>';
  $('steps').innerHTML = h;
}
const chev = '<svg viewBox="0 0 8 8" aria-hidden="true"><path d="M1.5 1l4 3-4 3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
const curveIc = '<svg viewBox="0 0 12 9" aria-hidden="true"><path d="M1 7.5C3 7.5 3.5 1.5 6 1.5S9 7.5 11 7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
function renderScenes() {
  let h = '<div class="lbl">Régler pour la scène</div>';
  SCENES.forEach((s, k) => {
    const n = count(s), na = lines(s).length;
    h += `<button class="sc ${S.sc === k ? 'cur' : ''}" style="--c:${s.c}" data-scene="${k}"><div class="row"><b style="flex:1">${s.n}<small>${s.bars} mes.</small></b>${na ? `<em class="apast" title="${na} courbe${na > 1 ? 's' : ''} d’automation">${curveIc}auto</em>` : ''}</div><span>${[...new Set(s.prog)].join(' ')}</span><div class="row"><span>${s.play ? mode(s)[1] : 'aucune'}</span>${n ? `<em class="abadge" style="font-style:normal" title="${n} accents">${chev}${n} accent${n > 1 ? 's' : ''}</em>` : ''}</div></button>`;

function renderHead() { const sc = cur(); $('sname').textContent = sc.n; $('ssub').textContent = `${sc.bars} mesures · basse`; $('listen').textContent = S.playing ? '■ Arrêter' : '▶ Écouter la scène'; }
function syncScroll() { document.querySelectorAll('.sx').forEach((e) => { e.scrollLeft = S.sl; }); }
function refresh() { renderSteps(); renderScenes(); renderRoll(); renderAuto(); renderMenu(); renderCards(); syncScroll(); document.body.classList.toggle('is-playing', S.playing); }
const render = () => { renderHead(); refresh(); };

/* défilement partagé : piano-roll, règle et courbes */
document.addEventListener('scroll', (e) => {
  const t = e.target; if (!t || !t.classList || !t.classList.contains('sx')) return;
  S.sl = t.scrollLeft; document.querySelectorAll('.sx').forEach((o) => { if (o !== t && o.scrollLeft !== t.scrollLeft) o.scrollLeft = t.scrollLeft; });
}, true);

/* ---------- tête de lecture factice ---------- */
let raf = 0, last = 0;
function tick(ts) {
  const sc = cur(), dur = sc.bars * 1.1; S.t = ((S.t || 0) + (ts - last) / 1000 / dur) % 1; last = ts;
  const W = sc.bars * BW, x = S.t * W;
  document.querySelectorAll('.ph').forEach((e) => { e.style.transform = `translateX(${x}px)`; });
  const scr = $('roll').querySelector('.sx');
  if (scr && (x < scr.scrollLeft + 10 || x > scr.scrollLeft + scr.clientWidth - 40)) { scr.scrollLeft = Math.max(0, x - 60); }
  document.querySelectorAll('.ln').forEach((el) => {
    const l = sc.auto[+el.dataset.line]; if (l) el.querySelector('[data-live]').textContent = 'maintenant ' + PARAMS[l.p].fmt(real(l.p, evalN(l.pts, S.t)));
  });
  raf = requestAnimationFrame(tick);
}
function setPlaying(v) {
  S.playing = v; cancelAnimationFrame(raf); document.body.classList.toggle('is-playing', v); $('listen').textContent = v ? '■ Arrêter' : '▶ Écouter la scène';
  if (v) { S.t = 0; last = performance.now(); raf = requestAnimationFrame(tick); } else document.querySelectorAll('.ph').forEach((e) => { e.style.transform = ''; });
}

/* ---------- courbes : réglages ---------- */
const lineEl = (i) => document.querySelector(`.ln[data-line="${i}"]`);
function redrawCurve(i) { const l = cur().auto[i], el = lineEl(i); el.querySelector('[data-cv]').innerHTML = curveSvg(l, cur().bars); el.querySelector('[data-rd]').textContent = readout(l); renderRollVelOnly(); }
function renderRollVelOnly() { /* la courbe de vélocité pâlit les notes : mise à jour sans reconstruire le piano-roll */
  const sc = cur(), vl = lines(sc).find((l) => l.p === 'vel'), nodes = document.querySelectorAll('#roll .nt'); if (!nodes.length) return;
  const notes = notesOf(sc); nodes.forEach((el, k) => { const n = notes[k]; el.style.opacity = vl && !sc.acc[n.s] ? (.45 + .55 * evalN(vl.pts, (n.abs + .5) / (sc.bars * 16))).toFixed(2) : 1; });
}
function regen(l) { l.pts = gen(l.g.shape, l.g.a, l.g.b, l.g.per, cur().bars); l.shape = l.g.shape; }
function setMeta(i) { const l = cur().auto[i], el = lineEl(i); el.querySelector('[data-meta]').innerHTML = chipsHtml(l); el.querySelector('[data-ctl]').innerHTML = ctlHtml(l); }
function toDrawn(i) { const l = cur().auto[i]; if (l.shape !== 'drawn') { l.shape = 'drawn'; setMeta(i); renderScenes(); } }

document.addEventListener('click', (ev) => {
  const tg = ev.target;
  if (S.menu && !tg.closest('.addw')) { S.menu = false; renderMenu(); }
  const t = tg.closest('[data-s],[data-scene],[data-pat],[data-rep],[data-mode],[data-act],#opensw,#listen,#copy,#addbtn,[data-addp],[data-hideall],[data-showall],[data-fold],[data-del],[data-shape],[data-revert],[data-per]'); if (!t) return;
  const sc = cur(), d = t.dataset, line = t.closest('.ln'), li = line ? +line.dataset.line : -1;
  if (t.id === 'listen') { setPlaying(!S.playing); return; }
  if (t.id === 'addbtn') { S.menu = !S.menu; renderMenu(); return; }
  const after = () => { renderAuto(); renderMenu(); renderScenes(); renderSteps(); renderRoll(); syncScroll(); };
  if (d.hideall !== undefined || d.showall !== undefined) { sc.auto.forEach((l) => { l.hidden = d.hideall !== undefined; }); after(); return; }
  if (d.fold !== undefined) { sc.auto[li].hidden = !sc.auto[li].hidden; after(); return; }
  if (d.addp) { sc.auto.push(lineOf(d.addp, 'flat', {}, sc.bars)); after(); return; }
  if (d.del !== undefined) { sc.auto.splice(+d.del, 1); after(); return; }
  if (d.shape) { const s = SH(d.shape); sc.auto[li].g = { shape: s.id, a: s.a, b: s.b, per: s.per || sc.auto[li].g.per || 2 }; regen(sc.auto[li]); setMeta(li); redrawCurve(li); return; }
  if (d.revert !== undefined) { regen(sc.auto[li]); setMeta(li); redrawCurve(li); renderScenes(); return; }
  if (d.per) { sc.auto[li].g.per = +d.per; regen(sc.auto[li]); setMeta(li); redrawCurve(li); return; }
  if (t.id === 'copy') {
    const o = t.textContent; t.textContent = '✓ Copié, automation comprise'; setTimeout(() => { t.textContent = o; }, 1500);
    SCENES.forEach((x) => { if (x !== sc) { x.acc = sc.acc.slice(); x.pat = sc.pat; x.force = sc.force; x.open = sc.open; x.bright = sc.bright; x.auto = sc.auto.map((l) => JSON.parse(JSON.stringify(l))); } }); refresh(); return;
  }
  if (t.id === 'opensw') sc.open = !sc.open;
  else if (d.scene !== undefined) { S.sc = +d.scene; S.sl = 0; S.t = 0; S.menu = false; renderHead(); }
  else if (d.s !== undefined) { if (t.disabled) return; toggle(+d.s); }
  else if (d.pat) applyPat(d.pat);
  else if (d.mode) sc.mode = d.mode;
  else if (d.act === 'clear') { sc.acc = mk(() => false); sc.pat = 'none'; }
  refresh();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.menu) { S.menu = false; renderMenu(); } });
document.addEventListener('change', (ev) => {
  if (ev.target.id === 'playchk') { cur().play = ev.target.checked; refresh(); }
  if (ev.target.id === 'piste') { S.synth = ev.target.value === 'synth'; S.menu = false; refresh(); }
});
document.addEventListener('input', (ev) => {
  const el = ev.target; if (!el.dataset || !el.dataset.sl) return;
  const li = +el.closest('.ln').dataset.line, l = cur().auto[li], w = el.dataset.sl;
  l.g[w] = el.value / 100; regen(l);
  const n = l.g[w], f = PARAMS[l.p].fmt; el.closest('.k').querySelector('[data-lab]').textContent = l.g.shape === 'lfo' && w === 'a' ? pct(n) : f(real(l.p, n));
  redrawCurve(li);
});

/* ---------- courbes : retouche au dessin ---------- */
let pd = null;
const svgPos = (svg, e) => { const r = svg.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top - PAD) / (H - 2 * PAD)]; };
document.addEventListener('pointerdown', (e) => {
  const g = e.target.closest('.hd'); if (!g || e.button !== 0 && e.button !== undefined) return;
  const li = +g.closest('.ln').dataset.line, i = +g.dataset.i, l = cur().auto[li];
  if (e.altKey) { e.preventDefault(); delPoint(li, i); return; }
  const svg = g.closest('svg'); svg.setPointerCapture(e.pointerId); e.preventDefault();
  pd = { li, i, svg, moved: false };
});
document.addEventListener('pointermove', (e) => {
  if (!pd) return;
  const l = cur().auto[pd.li], pts = l.pts, [fx, fy] = svgPos(pd.svg, e), last = pts.length - 1, step = 1 / (cur().bars * 8);
  let x = pts[pd.i][0];
  if (pd.i > 0 && pd.i < last) x = Math.min(pts[pd.i + 1][0] - .0004, Math.max(pts[pd.i - 1][0] + .0004, Math.round(fx / step) * step));
  const y = Math.round(cl(fy) * 100) / 100;
  if (x === pts[pd.i][0] && y === pts[pd.i][1]) return;
  pts[pd.i] = [r3(x), y];
  if (!pd.moved) { pd.moved = true; toDrawn(pd.li); }
  redrawCurve(pd.li);
});
const endDrag = () => { pd = null; };
document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
function delPoint(li, i) {
  const l = cur().auto[li]; if (i === 0 || i === l.pts.length - 1 || l.pts.length <= 2) return;
  l.pts.splice(i, 1); toDrawn(li); redrawCurve(li);
}
document.addEventListener('contextmenu', (e) => {
  const svg = e.target.closest('[data-cv]'); if (!svg) return; e.preventDefault();
  const g = e.target.closest('.hd'); if (g) delPoint(+g.closest('.ln').dataset.line, +g.dataset.i);
});
document.addEventListener('dblclick', (e) => {
  const svg = e.target.closest('[data-cv]'); if (!svg || e.target.closest('.hd')) return;
  const li = +svg.closest('.ln').dataset.line, l = cur().auto[li], [fx, fy] = svgPos(svg, e), x = r3(Math.min(.999, Math.max(.001, fx)));
  const k = l.pts.findIndex((p) => p[0] > x); if (k < 1) return;
  l.pts.splice(k, 0, [x, Math.round(cl(fy) * 100) / 100]); toDrawn(li); redrawCurve(li);
});
/* potentiomètres : glisser verticalement, molette, flèches */
function setKnob(el, v) {
  const sc = cur(), k = el.dataset.knob; v = Math.max(0, Math.min(100, Math.round(v))); sc[k] = v;
  el.innerHTML = knobHtml(v); el.setAttribute('aria-valuenow', v);
  if (k === 'force') { $('fv').textContent = v; $('fl').textContent = legend(v); } else $('bv').textContent = v;
}
let drag = null;
document.addEventListener('pointerdown', (e) => { const el = e.target.closest('.knob'); if (!el) return; drag = { el, y: e.clientY, v: cur()[el.dataset.knob] }; el.setPointerCapture(e.pointerId); el.focus(); e.preventDefault(); });
document.addEventListener('pointermove', (e) => { if (drag) setKnob(drag.el, drag.v + (drag.y - e.clientY) * 0.7); });
document.addEventListener('pointerup', () => { drag = null; });
document.addEventListener('wheel', (e) => { const el = e.target.closest('.knob'); if (!el) return; e.preventDefault(); setKnob(el, cur()[el.dataset.knob] - Math.sign(e.deltaY) * 3); }, { passive: false });
document.addEventListener('keydown', (e) => { const el = e.target.closest && e.target.closest('.knob'); if (!el) return; const dv = { ArrowUp: 5, ArrowRight: 5, ArrowDown: -5, ArrowLeft: -5, Home: -100, End: 100 }[e.key]; if (dv === undefined) return; e.preventDefault(); setKnob(el, cur()[el.dataset.knob] + dv); });
render();
})();
</script></body></html>
