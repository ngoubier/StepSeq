/* Studio sombre de StepSeq : en-tête transport, colonne des 10 étapes, éditeur scène par scène. Thème unique, sombre, comme l'application. */
:root {
  color-scheme: dark;
  --bg: #121215; --panel: #1b1b20; --panel2: #232329; --raise: #2c2c34; --line: #36363f; --line2: #4a4a55;
  --text: #ececf1; --muted: #9c9ca8; --dim: #6a6a76;
  --accent: #3b8eea; --accent-ink: #0b1a2c; --gold: #c9a227; --led: #ff3b2a;
  --drums: #e3179c; --bass: #3fcf3f; --pad: #4f6bff; --arp: #13c2a3; --lead: #9b5cff; --chords: #c9a227;
  --repos: #3fcf8e; --prep: #f5c400; --tension: #ff6b6b;
  --f-body: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-lcd: Seg14, "Courier New", monospace;
  --r: 8px;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--f-body); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand b { font-weight: 700; letter-spacing: .01em; }
.brand span { color: var(--muted); font-size: 12px; }
.title-in { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; font-weight: 600; min-width: 0; width: 220px; max-width: 100%; }
.title-in:hover, .title-in:focus { border-color: var(--line2); background: var(--panel2); }
.lcd { font: 18px/1 var(--f-lcd); color: var(--led); background: #1a0606; border: 1px solid #000; border-radius: 4px; padding: 7px 10px 5px; text-shadow: 0 0 6px rgba(255,59,42,.7); white-space: nowrap; display: flex; gap: 14px; }
.lcd small { font-family: var(--f-body); font-size: 9px; color: #b9625a; text-shadow: none; display: block; letter-spacing: .08em; margin-bottom: 2px; }
.transport { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 11px; font-weight: 600; font-size: 13px; }
.tbtn:hover { background: var(--raise); }
.tbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tbtn svg { width: 14px; height: 14px; fill: currentColor; }

.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 18px; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1500px; margin: 0 auto; }
.stepper { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 76px; align-self: start; }
.stepper h6 { margin: 10px 8px 4px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.stepper h6:first-child { margin-top: 0; }
.st { display: grid; grid-template-columns: 26px 1fr; gap: 2px 10px; align-items: center; text-align: left; background: transparent; border: 1px solid transparent; border-radius: var(--r); padding: 7px 8px; }
.st:hover { background: var(--panel); }
.st.cur { background: var(--panel2); border-color: var(--line2); }
.st i { grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line2); color: var(--muted); }
.st.cur i { background: var(--accent); border-color: var(--accent); color: #fff; }
.st.done i { border-color: var(--c, var(--repos)); color: var(--c, var(--repos)); }
.st b { font-weight: 600; font-size: 13px; }
.st span { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.head h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.head h1 em { font-style: normal; color: var(--dim); font-weight: 600; margin-right: 8px; font-variant-numeric: tabular-nums; }
.head p { margin: 0; color: var(--muted); max-width: 78ch; }
.code-note { font-size: 11.5px; color: var(--dim); border-top: 1px dashed var(--line); padding-top: 10px; }
.code-note code { color: var(--muted); background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: 11px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.card h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }

.chip { background: var(--panel2); border: 1px solid var(--line2); border-radius: 999px; padding: 5px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { background: var(--raise); }
.chip.on { background: color-mix(in srgb, var(--c, var(--accent)) 22%, var(--panel2)); border-color: var(--c, var(--accent)); color: var(--text); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--accent)); }
.chip.off { opacity: .45; }
.seg { display: inline-flex; background: var(--panel2); border: 1px solid var(--line2); border-radius: 7px; padding: 2px; flex-wrap: wrap; }
.seg button { background: transparent; border: 0; border-radius: 5px; padding: 5px 11px; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--raise); color: var(--text); box-shadow: inset 0 0 0 1px var(--line2); }
.btn { background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 12px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--raise); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.gold { border-color: var(--gold); color: var(--gold); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn:disabled { opacity: .4; cursor: default; }
.ico { width: 13px; height: 13px; fill: currentColor; flex: none; }

/* étape 1 */
.styles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.style-card { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.style-card:hover { border-color: var(--line2); }
.style-card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.style-card canvas { width: 100%; height: 110px; display: block; }
.style-card .sc-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
.style-card h2 { margin: 0; font-size: 19px; }
.style-card p { margin: 0; color: var(--muted); font-size: 13px; }

'use strict';
/* =========================================================

    if (role === 'pad') chordMidis({ d: 0, x: '' }, 55).forEach((n) => voice(name, n, t, 1.6, .8, bus.pad));
    if (role === 'arp') [0, 3, 7, 12, 15, 19, 24, 19].map((iv, i) => voice(name, 60 + mod(S.tonic, 12) + (MODES[S.mode].iv[2] === 4 && (iv % 12 === 3) ? iv + 1 : iv), t + i * sd, sd * .8, .8, bus.arp));
    if (role === 'lead') [0, 2, 4, 7, 4].forEach((d, i) => voice(name, 72 + mod(S.tonic, 12) + degOff(d === 7 ? 4 : d), t + i * sd * 3, sd * 2.8, .85, bus.lead));
  });
}
function playScale() { audition((t) => { const sd = .16; [0, 1, 2, 3, 4, 5, 6, 7].forEach((d, i) => voice('piano', 60 + S.tonic + degOff(d), t + i * sd, sd * .95, .8, bus.chords)); }); }

/* Tête de lecture */
function frame() {
  if (play.on && ctx) {
    let cur = null; while (play.queue.length && play.queue[0].t <= ctx.currentTime) cur = play.queue.shift();
    if (cur) paintHead(cur);
  }
  requestAnimationFrame(frame);
}
function paintHead(cur) {
  play.shown = cur;
  const pos = document.getElementById('lcdPos');
  pos.textContent = cur ? `${String(Math.floor(cur.s / 16) + 1).padStart(2, '0')}.${Math.floor(cur.s % 16 / 4) + 1}` : '--.-';
  document.querySelectorAll('.ph').forEach((el) => {
    const on = cur && el.dataset.scene === cur.id; el.style.display = on ? 'block' : 'none';
    if (on) el.style.left = (cur.s / (+el.dataset.n) * 100) + '%';
  });
  document.querySelectorAll('.cell.now, .bars span.now, .cslot.now, .blk.now').forEach((e) => e.classList.remove('now'));
  document.querySelectorAll('.rs').forEach((e) => e.classList.toggle('playing', !!cur && e.dataset.id === cur.id));
  if (!cur) return;
  if (cur.id === S.cur) {
    document.querySelectorAll(`.cell[data-s="${cur.s % 16}"]`).forEach((e) => e.classList.add('now'));
    const bar = Math.floor(cur.s / 16);
    document.querySelector(`.bars span[data-b="${bar}"]`)?.classList.add('now');
    document.querySelector(`.cslot[data-i="${bar}"]`)?.classList.add('now');
  }
  if (play.mode === 'song') document.querySelector(`.blk[data-ai="${play.li}"]`)?.classList.add('now');
}

}

function stepSummary(i) {

function drawArt(cv) {
  const id = cv.dataset.art, g = cv.getContext('2d'), w = cv.width, h = cv.height;
  const bgs = { synthwave: ['#1b0b2e', '#3a0d4a', '#ff3d8b'], edm: ['#06121f', '#0a2a4a', '#2bd1ff'], ambient: ['#0d1a1a', '#173a3a', '#9fe8d0'] }[id];
  const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, bgs[0]); grd.addColorStop(1, bgs[1]); g.fillStyle = grd; g.fillRect(0, 0, w, h);
  g.strokeStyle = bgs[2]; g.globalAlpha = .8;
  if (id === 'synthwave') {
    const hy = h * .55; g.fillStyle = '#ff8a3d'; g.beginPath(); g.arc(w / 2, hy, 60, Math.PI, 0); g.fill();
    g.fillStyle = bgs[1]; for (let i = 0; i < 5; i++) g.fillRect(w / 2 - 62, hy - 10 - i * 11, 124, 3 + i * .6);
    g.globalAlpha = .6; for (let i = 0; i < 9; i++) { const y = hy + Math.pow(i / 8, 2) * (h - hy); g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    for (let i = -10; i <= 10; i++) { g.beginPath(); g.moveTo(w / 2 + i * 12, hy); g.lineTo(w / 2 + i * 80, h); g.stroke(); }
  } else if (id === 'edm') {
    for (let i = 0; i < 40; i++) { const x = i * w / 40 + 4, v = Math.abs(Math.sin(i * .7) * Math.cos(i * .23)) * h * .7 + 10; g.fillStyle = i % 4 === 0 ? '#fff' : bgs[2]; g.globalAlpha = .8; g.fillRect(x, h - v, w / 40 - 5, v); }
  } else {
    g.lineWidth = 2; for (let k = 0; k < 6; k++) { g.globalAlpha = .15 + k * .1; g.beginPath(); for (let x = 0; x <= w; x += 6) { const y = h * .5 + Math.sin(x / 80 + k) * (20 + k * 6) + k * 8 - 20; x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
  }
  g.globalAlpha = 1;
}

  bar.forEach(([o, l, iv]) => { const y = iv === 12 ? 2 : iv === 7 ? 6 : iv === 'T' ? 10 : iv === 'A' ? 8 : 14; s += `<rect x="${o * 10 + .5}" y="${y}" width="${Math.max(3, l * 10 - 1.5)}" height="6" rx="1.5" fill="${color}"/>`; });

/* ----- 10 Mélodie : l'onglet Mélodie de la fenêtre Harmonie ----- */

function wrapMel(track, body) {
  return head(10, 'Mélodie', 'L’onglet Mélodie de la fenêtre Harmonie, scène par scène. La grille vient de l’étape Accords ; l’émotion de la scène (choisie avec l’ambiance) donne le profil : contour, note visée, fin, reprise du motif. Chaque réglage s’entend tout de suite dans la boucle.')
    + work(10, 'lead', track, body) + codeNote('<code>js/melodypanel.js</code> monté avec <code>sharedGrid</code> (la grille de la scène, pas de champ Grille ni Tonalité), moteur <code>js/melody.js</code>, profils <code>js/melody-profiles.js</code>.') + nav();
}
/* ----- Piano roll ----- */
function drawRoll(cv) {
  const sc = scene(cv.dataset.roll); if (!sc) return;
  const role = { 7: 'bass', 8: 'pad', 9: 'arp', 10: 'lead' }[S.step]; const r = rendered(sc), list = r[role + 'L'];
  const W = cv.clientWidth * 2 || 1200, H = role === 'lead' ? 440 : cv.height; cv.width = W; cv.height = H; cv.style.height = H / 2 + 'px';
  const g = cv.getContext('2d'); g.fillStyle = '#141418'; g.fillRect(0, 0, W, H);
  const n = r.n, x = (s) => s / n * W, band = 34;
  const notes = list.map((e) => e.n); const lo = Math.min(...notes, 60) - 2, hi = Math.max(...notes, lo + 12) + 2;
  const y = (m) => band + (hi - m) / (hi - lo + 1) * (H - band - 6);
  const rowH = (H - band - 6) / (hi - lo + 1);
  for (let m = lo; m <= hi; m++) { if (BLACK.includes(mod(m, 12))) { g.fillStyle = '#18181d'; g.fillRect(0, y(m), W, rowH); } if (mod(m - S.tonic, 12) === 0) { g.fillStyle = 'rgba(63,207,142,.07)'; g.fillRect(0, y(m), W, rowH); } }
  for (let s = 0; s <= n; s += 4) { g.fillStyle = s % 16 === 0 ? '#3a3a44' : '#222229'; g.fillRect(x(s), band, s % 16 === 0 ? 2 : 1, H); }
  for (let b = 0; b < sc.bars; b++) {
    const c = sc.chords[b % sc.chords.length], f = func(c.d), col = { repos: '#3fcf8e', prep: '#f5c400', tension: '#ff6b6b' }[f];
    g.fillStyle = '#1f1f26'; g.fillRect(x(b * 16) + 2, 4, x(16) - 4, band - 8); g.fillStyle = col; g.fillRect(x(b * 16) + 2, band - 7, x(16) - 4, 3);
    g.fillStyle = '#ececf1'; g.font = '600 22px Inter, sans-serif'; g.fillText(chordName(c), x(b * 16) + 10, 25);
  }
  const hex = ROLES[role].hex;
  list.forEach((e) => {
    let col = hex; if (role === 'lead') col = NOTE_KIND[e.kind][1]; if (e.appr) col = '#b8f5b8';
    g.fillStyle = col; const w = Math.max(3, x(e.l) - 2), hh = Math.max(4, rowH - 2); g.fillRect(x(e.s) + 1, y(e.n) + 1, w, hh);
    if (role === 'lead') { const nm = noteName(e.n); g.font = '600 17px Inter, sans-serif'; const tw = g.measureText(nm).width; g.fillStyle = tw + 6 < w && hh >= 16 ? '#0b0b10' : '#c9c9d4'; tw + 6 < w && hh >= 16 ? g.fillText(nm, x(e.s) + 4, y(e.n) + hh - 2) : g.fillText(nm, x(e.s) + 2, y(e.n) - 2); }
  });
  g.fillStyle = '#6a6a76'; g.font = '18px Inter, sans-serif'; g.fillText(NOTE_EN[mod(hi, 12)] + (Math.floor(hi / 12) - 1), 6, band + 18); g.fillText(NOTE_EN[mod(lo, 12)] + (Math.floor(lo / 12) - 1), 6, H - 10);
}

/* ----- Rendu général ----- */
const VIEWS = { 1: vStyle, 2: vInst, 3: vTempo, 4: vScenes, 5: vDrums, 6: vChords, 7: vBass, 8: vPad, 9: vArp, 10: vMel };
let created = false;
function render() {
  if (STEPS[S.step - 1].role && S.enabled[STEPS[S.step - 1].role] === false) { /* rôle retiré : on garde l'étape visible mais muette */ }
  const main = document.getElementById('main');
  main.innerHTML = VIEWS[S.step]() + (created && S.step === 10 ? doneBox() : '');
  renderStepper(); updTransport();
  main.querySelectorAll('canvas[data-art]').forEach(drawArt);
  main.querySelectorAll('canvas[data-roll]').forEach(drawRoll);
  bindTimeline();
  if (play.shown) paintHead(play.shown);
}
function doneBox() {
  const tracks = ['drums', 'bass', 'pad', 'arp', 'lead'].filter((r) => S.enabled[r]);
  const total = S.arr.reduce((a, id) => a + scene(id).bars, 0);
  return `<div class="done-box"><h3>Chanson créée (maquette)</h3><p style="margin:0">« ${esc(document.getElementById('songTitle').value)} » : ${tracks.length} pistes (${tracks.map((r) => ROLES[r].n + ' · ' + S.inst[r]).join(', ')}), ${S.scenes.length} scènes, ${S.arr.length} blocs, ${total} mesures à ${S.bpm} BPM en ${keyLabel()}. Dans l'application : écriture des pistes, de la piste Accords, des scènes et de l'arrangement, mixage automatique, Ctrl+Z pour revenir.</p></div>`;
}
function go(i) {
  i = Math.max(1, Math.min(10, i)); if (i === S.step) return;
  S.step = i; S.visited.add(i);
  S.listen.chords = i === 6;
  if (i >= 5) { const role = STEPS[i - 1].role; if (role && role !== 'chords') S.listen[role] = true; }
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* Glisser-déposer du mode Song */
let dragFrom = null;
function bindTimeline() {
  document.querySelectorAll('#timeline .blk').forEach((el) => {
    el.addEventListener('dragstart', (e) => { dragFrom = +el.dataset.ai; el.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(dragFrom)); } catch (_) {} });
    el.addEventListener('dragend', () => el.classList.remove('drag'));
    el.addEventListener('dragover', (e) => e.preventDefault());
    el.addEventListener('drop', (e) => { e.preventDefault(); const to = +el.dataset.ai; if (dragFrom === null || dragFrom === to) return; const [m] = S.arr.splice(dragFrom, 1); S.arr.splice(to, 0, m); dragFrom = null; render(); });
  });
}

/* Actions */
let taps = [];
const ACT = {
  go: (el) => go(+el.dataset.v),
  playScene: () => (play.on && play.mode === 'scene') ? stop() : start('scene'),
  playSong: () => (play.on && play.mode === 'song') ? stop() : start('song'),
  stop: () => stop(),
  style: (el) => { stop(); applyStyle(el.dataset.v); S.visited = new Set([1]); render(); start('scene'); },
  enable: (el) => { S.enabled[el.dataset.v] = el.checked; changed(); render(); },
  inst: (el) => { S.inst[el.dataset.r] = el.dataset.v; render(); playInst(el.dataset.r); },
  hear: (el) => playInst(el.dataset.v),
  bpm: (el) => { S.bpm = Math.max(40, Math.min(200, S.bpm + +el.dataset.v)); render(); },
  tap: () => { const t = performance.now(); taps = taps.filter((x) => t - x < 2500); taps.push(t); if (taps.length >= 4) { const d = (taps[taps.length - 1] - taps[0]) / (taps.length - 1); S.bpm = Math.round(60000 / d); render(); } },
  tonic: (el) => { S.tonic = +el.dataset.v; changed(); render(); playScale(); },
  mode: (el) => { S.mode = el.dataset.v; changed(); render(); playScale(); },
  scale: () => playScale(),
  bars: (el) => { const sc = scene(el.dataset.id), b = +el.dataset.v; const prog = sc.chords.slice(0, 4); sc.chords = Array.from({ length: b }, (_, i) => sc.chords[i] || { ...prog[i % prog.length] }); sc.bars = b; changed(); render(); },
  arrAdd: (el) => { S.arr.push(el.dataset.id); render(); },
  arrDel: (el, e) => { e.stopPropagation(); S.arr.splice(+el.dataset.v, 1); render(); },
  delScene: (el) => { const id = el.dataset.id; S.scenes = S.scenes.filter((s) => s.id !== id); S.arr = S.arr.filter((x) => x !== id); if (S.cur === id) S.cur = S.scenes[0].id; changed(); render(); },
  newScene: (el) => { const sc = newScene(el.dataset.v, 8, STYLES[S.style]); S.scenes.push(sc); S.arr.push(sc.id); S.cur = sc.id; changed(); render(); },
  tplStruct: () => { const st = STYLES[S.style]; const byType = {}; S.scenes.forEach((s) => byType[s.type] = byType[s.type] || s.id); S.arr = st.arr.map((i) => { const t = st.scenes[i][0]; if (!byType[t]) { const s = newScene(t, st.scenes[i][1], st); S.scenes.push(s); byType[t] = s.id; } return byType[t]; }); changed(); render(); },
  pick: (el) => { S.cur = el.dataset.id; S.chordSel = 0; if (play.on && play.mode === 'scene') { play.list = [S.cur]; play.li = 0; play.s = play.s % (scene().bars * 16); } arpSync(); render(); },
  copyAll: () => { const sc = scene(), k = { 5: 'drums', 6: 'chords', 7: 'bass', 8: 'pad', 9: 'arp', 10: 'mel' }[S.step]; S.scenes.forEach((o) => { if (o !== sc && o.type === sc.type) o[k] = JSON.parse(JSON.stringify(sc[k])); }); changed(); render(); },
  listen: (el) => { S.listen[el.dataset.v] = !S.listen[el.dataset.v]; render(); },
  solo: (el) => { const r = el.dataset.v === 'chords' ? 'chords' : el.dataset.v; const only = Object.keys(S.listen).every((k) => S.listen[k] === (k === r)); for (const k in S.listen) S.listen[k] = only ? k !== 'chords' || S.step === 6 : k === r; render(); },
  lane: (el) => { S.drumOn[el.dataset.v] = !S.drumOn[el.dataset.v]; render(); },
  cell: (el) => { const sc = scene(), d = sc.drums; if (!d.edits) d.edits = { ...patOf(sc).lanes }; const L = el.dataset.l, s = +el.dataset.s; const arr = (d.edits[L] || E16).split(''); arr[s] = arr[s] === '-' ? 'x' : arr[s] === 'x' ? 'o' : arr[s] === 'o' ? '.' : '-'; d.edits[L] = arr.join(''); changed(); render(); if (arr[s] !== '-') { audio(); drum(L === 'S' || L === 'C' || L === 'H' || L === 'O' || L === 'K' ? L : 'K', velOf(arr[s]), ctx.currentTime + .02); } },
  unedit: () => { scene().drums.edits = null; changed(); render(); },
  fill: (el) => { scene().drums.fill = el.dataset.v; changed(); render(); },
  crash: (el) => { scene().drums.crash = el.checked; changed(); render(); },
  efilter: (el) => { S.energyFilter = +el.dataset.v; render(); },
  pat: (el) => { const d = scene().drums; d.pat = +el.dataset.v; d.edits = null; changed(); render(); if (!play.on) start('scene'); },
  autoDrums: () => { const pats = PATTERNS[S.style], st = STYLES[S.style]; S.scenes.forEach((sc) => { const e = TYPES[sc.type].e; sc.drums.pat = st.drums[sc.type] ?? pats.findIndex((p) => p.e === e); sc.drums.edits = null; }); changed(); render(); },
  cslot: (el) => { S.chordSel = +el.dataset.i; playChordNow(scene().chords[S.chordSel]); render(); },
  palMode: (el) => { S.palMode = el.dataset.v; if (S.palMode === 'simple') S.ext = ''; render(); },
  ext: (el) => { S.ext = el.dataset.v; render(); },
  palPick: (el) => { const sc = scene(); const c = { d: +el.dataset.v, x: S.palMode === 'avance' ? S.ext : '' }; sc.chords[Math.min(S.chordSel, sc.bars - 1)] = c; playChordNow(c); S.chordSel = (S.chordSel + 1) % sc.bars; changed(); render(); },
  loop4: () => { const sc = scene(); sc.chords = sc.chords.map((_, i) => ({ ...sc.chords[i % 4] })); changed(); render(); },
  playChords: () => { S.listen.chords = true; start('scene'); render(); },
  propHear: (el) => { const p = AMBIANCES[S.ambiance].p[+el.dataset.v]; audition((t) => p.forEach((d, i) => chordMidis({ d, x: '' }, 52).forEach((n) => voice('piano', n, t + i * .7, .65, .75, bus.chords)))); },
  propUse: (el) => { const sc = scene(), p = AMBIANCES[S.ambiance].p[+el.dataset.v]; sc.emotion = AMBIANCES[S.ambiance].emo; sc.chords = sc.chords.map((_, i) => ({ d: p[i % 4], x: '' })); changed(); render(); if (!play.on) start('scene'); },
  bmode: (el) => { scene().bass.mode = el.dataset.v; changed(); render(); if (!play.on) start('scene'); },
  pedal: (el) => { scene().bass.pedal = el.dataset.v; changed(); render(); },
  boct: (el) => { scene().bass.oct = el.dataset.v; changed(); render(); },
  approach: (el) => { scene().bass.approach = el.checked; changed(); render(); },
  padOn: (el) => { scene().pad.on = el.checked; changed(); render(); },
  prh: (el) => { scene().pad.rhythm = el.dataset.v; changed(); render(); if (!play.on) start('scene'); },
  pvo: (el) => { scene().pad.voicing = el.dataset.v; changed(); render(); },
  arpOn: (el) => { scene().arp.on = el.checked; changed(); render(); },
  motifStep: (el) => { const a = scene().arp, k = Object.keys(ARP_MOTIFS); a.motif = k[mod(k.indexOf(a.motif) + +el.dataset.v, k.length)]; changed(); render(); if (!play.on) start('scene'); },
  surprise: () => { const a = scene().arp, k = Object.keys(ARP_MOTIFS); a.motif = k[Math.floor(Math.random() * k.length)]; a.rate = Math.random() < .6 ? 16 : 8; a.oct = 1 + Math.floor(Math.random() * 3); a.density = 50 + Math.floor(Math.random() * 50); a.move = Math.floor(Math.random() * 80); a.echo = Math.floor(Math.random() * 70); changed(); arpSync(); render(); if (!play.on) start('scene'); },
  arate: (el) => { scene().arp.rate = +el.dataset.v; changed(); render(); },
  melOn: (el) => { scene().mel.on = el.checked; changed(); render(); },
  melGo: () => { const m = scene().mel; if (m.generated) m.seed++; m.generated = true; m.on = true; m.variant = null; m.variantN = 0; changed(); render(); if (!play.on) start('scene'); },
  variantB: () => { const sc = scene(), m = sc.mel, P = melProfile(sc, false), lev = ['contour', 'ending', 'target', 'repeat'], D = { contour: CONTOURS, ending: ENDINGS, target: TARGETS, repeat: REPEATS };
    m.variantN++; const key = lev[(m.variantN - 1) % 4], ks = Object.keys(D[key]), to = ks[(ks.indexOf(P[key]) + 1) % ks.length];
    const lab = (k, v) => k === 'contour' ? CONTOURS[v].n.toLowerCase() : short(D[k][v]);
    m.variant = { key, to, text: `${{ contour: 'contour', ending: 'fin', target: 'note visée', repeat: 'reprise' }[key]} ${lab(key, P[key])} → ${lab(key, to)}` }; changed(); render(); },
  variantA: () => { scene().mel.variant = null; changed(); render(); },
  motif: (el) => { const m = scene().mel; m.over.motif = el.dataset.v; m.variant = null; changed(); render(); },
  pivot: (el) => { scene().mel.pivot = el.dataset.v; changed(); render(); },
  orn: (el) => { const sc = scene(), P = melProfile(sc, false), cur = new Set(sc.mel.over.ornaments || P.ornaments); el.checked ? cur.add(el.dataset.v) : cur.delete(el.dataset.v); sc.mel.over.ornaments = Object.keys(ORNAMENTS).filter((k) => cur.has(k)); sc.mel.variant = null; changed(); render(); },
  profReset: () => { const m = scene().mel; m.over = {}; m.variant = null; changed(); render(); },
  create: () => { created = true; stop(); render(); document.querySelector('.done-box')?.scrollIntoView({ behavior: 'smooth' }); },
};
document.addEventListener('click', (e) => {
  const sum = e.target.closest('summary'); if (sum) { const d = sum.parentElement; if (d.matches('[data-fine]')) S.melFine = !d.open; if (d.matches('[data-more]')) S.melMore = !d.open; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.type === 'checkbox') return; // traité par « change »
  const f = ACT[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.type === 'checkbox' && el.dataset.act) { ACT[el.dataset.act](el, e); return; }
  if (el.dataset.mset) { const m = scene().mel; m[el.dataset.mset] = el.value; if (el.dataset.mset === 'emo') { m.over = {}; m.variant = null; m.variantN = 0; } changed(); render(); return; }
  if (el.dataset.over) { const m = scene().mel; m.over[el.dataset.over] = el.value; m.variant = null; changed(); render(); return; }
  if (el.dataset.axis) { const m = scene().mel; m.over.axes = { ...(m.over.axes || {}), [el.dataset.axis]: +el.value }; m.variant = null; changed(); render(); return; }
  const k = el.dataset.set; if (!k) return;
  if (k === 'inst') { S.inst[el.dataset.r] = el.value; playInst(el.dataset.r); render(); }
  if (k === 'fillType') { scene().drums.fillType = el.value; changed(); render(); }
  if (k === 'ambiance') { S.ambiance = el.value; render(); }
  if (k === 'name') { scene(el.dataset.id).name = el.value; render(); }
});
document.addEventListener('input', (e) => {
  const el = e.target, k = el.dataset.set; if (!k) return;
  const v = +el.value, a = scene().arp;
  if (k === 'bpm') { S.bpm = v; updTransport(); renderStepper(); el.closest('.bpm').querySelector('.lcd').textContent = v; return; }
  if (k === 'swing') { S.swing = v; el.nextElementSibling.textContent = v + ' %'; return; }
  if (['density', 'aoct', 'move', 'echo'].includes(k)) {
    if (k === 'density') a.density = v; if (k === 'aoct') a.oct = v; if (k === 'move') a.move = v; if (k === 'echo') a.echo = v;
    el.previousElementSibling.querySelector('b').textContent = k === 'aoct' ? v + ' oct.' : v + ' %';
    changed(); arpSync(); document.querySelectorAll('canvas[data-roll]').forEach(drawRoll);
  }
});
document.addEventListener('toggle', (e) => { if (e.target.matches?.('[data-fine]')) S.melFine = e.target.open; if (e.target.matches?.('[data-more]')) S.melMore = e.target.open; }, true);
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON', 'SUMMARY'].includes(document.activeElement.tagName)) { e.preventDefault(); ACT.playScene(); }
});
window.addEventListener('resize', () => document.querySelectorAll('canvas[data-roll]').forEach(drawRoll));

applyStyle('synthwave');
S.step = 5; [1, 2, 3, 4, 5].forEach((i) => S.visited.add(i));
render(); requestAnimationFrame(frame);
})();
</script>
