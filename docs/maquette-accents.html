<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accents de basse</title>
<style>
/* Assistant « Nouvelle chanson » : un onglet par instrument, le type (Drums, Basse, Accords, Arpèges, Mélodie) choisit l'éditeur. */
:root {
  color-scheme: dark;
  --bg: #121215; --panel: #1b1b20; --panel2: #232329; --raise: #2c2c34; --line: #36363f; --line2: #4a4a55;
  --text: #ececf1; --muted: #9c9ca8; --dim: #6a6a76; --accent: #3b8eea; --gold: #c9a227;
  --drums: #e3179c; --bass: #3fcf3f; --pad: #4f6bff; --arp: #13c2a3; --lead: #9b5cff; --master: #d0d0da;
  --ok: #3fcf8e; --warn: #f5c400; --hot: #ff5c5c;
  --r-ctl: 6px; --r-card: 10px; --h: 30px; --h-sm: 26px;
  --f: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--f); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* bandeau principal */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: #1f1f24; border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.logo { width: 40px; height: 40px; border-radius: 9px; background: #23232a; display: grid; place-items: center; flex: none; }
.ptitle { font-size: 19px; font-weight: 700; min-width: 0; }
.tbox { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; letter-spacing: .06em; }
.tbox input { width: 64px; height: 30px; background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--r-ctl); text-align: center; color: var(--text); font-size: 14px; }
.play { width: 64px; height: 44px; border-radius: 8px; border: 0; background: #2ea44f; color: #fff; display: grid; place-items: center; }
.play.on { background: #1f7a3a; }
.stopb { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel2); display: grid; place-items: center; }
.pos { min-width: 130px; padding: 4px 14px; border-radius: 8px; background: #0f1830; text-align: center; color: #6aa9ff; font: 600 18px/1.1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .15em; }
.pos small { display: block; font: 12px var(--f); letter-spacing: 0; color: #9db8e8; }
.keybox { padding: 4px 12px; border: 1px solid var(--line2); border-radius: 8px; background: var(--panel2); }
.keybox small { display: block; font-size: 9px; letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }
.keybox b { font-size: 15px; }
.spacer { flex: 1; }
.ghost { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel2); color: var(--muted); }


.body { display: grid; grid-template-columns: 216px 200px minmax(0, 1fr); gap: 16px; padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.body.noscene { grid-template-columns: 216px minmax(0, 1fr); }
.body.noscene .scenes { display: none; }
.steps { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.steps h6 { margin: 10px 8px 4px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.steps h6:first-child { margin-top: 0; }
.st { display: grid; grid-template-columns: 26px 1fr; gap: 0 10px; align-items: center; padding: 6px 8px; border-radius: 8px; border: 1px solid transparent; background: none; text-align: left; width: 100%; }
.st:hover { background: var(--panel); }
.st i { grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; border: 1px solid var(--line2); color: var(--muted); }
.st.inst i { border-color: var(--c); color: var(--c); }
.st.cur { background: var(--panel2); border-color: var(--line2); }
.st.cur i { background: var(--accent); border-color: var(--accent); color: #fff; }
.st.inst.cur i { background: var(--c); border-color: var(--c); color: #0b0b0e; }
.st b { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
.st b .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.st b .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st > span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st.gold i { border-color: var(--gold); color: var(--gold); }
.st.gold.cur i { background: var(--gold); color: #0b0b0e; }

.scenes { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.sc { text-align: left; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.sc:hover { background: var(--panel2); }
.sc.cur { background: var(--panel2); box-shadow: inset 0 0 0 1px var(--c); }
.sc b { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
.sc b small { font-weight: 500; color: var(--dim); }
.sc span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc span.mute { color: var(--warn); }

.main { min-width: 0; display: flex; flex-direction: column; gap: 14px; --c: var(--accent); }
.head h1 { margin: 0; font-size: 22px; } .head h1 em { font-style: normal; color: var(--dim); margin-right: 8px; }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 80ch; }
.btn { height: var(--h); padding: 0 12px; border-radius: var(--r-ctl); border: 1px solid var(--line2); background: var(--panel2); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.btn:hover { background: var(--raise); }
.btn.sm { height: var(--h-sm); padding: 0 8px; font-size: 12px; }
.btn.pri { background: color-mix(in srgb, var(--c) 30%, var(--panel2)); border-color: var(--c); }
.btn.on { background: #6b4b00; border-color: var(--warn); color: var(--warn); }
.btn.s.on { background: #0f3a5a; border-color: var(--accent); color: #9ccaff; }
.btn.gold { border-color: var(--gold); color: var(--gold); }

/* sélecteur de type */
.types { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.ty { text-align: left; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--tc); border-radius: var(--r-card); padding: 8px 10px; display: grid; grid-template-columns: 30px 1fr; gap: 0 8px; align-items: center; }
.ty:hover { background: var(--panel2); }
.ty svg { grid-row: span 2; width: 30px; height: 30px; color: var(--tc); }
.ty b { font-size: 13.5px; }
.ty small { grid-column: 2; font-size: 11px; color: var(--muted); line-height: 1.3; }
.ty.on { background: color-mix(in srgb, var(--tc) 16%, var(--panel)); box-shadow: inset 0 0 0 1px var(--tc); }
.tnote { margin: 0; font-size: 12.5px; padding: 6px 10px; border-radius: 8px; border: 1px dashed var(--c); color: var(--text); background: color-mix(in srgb, var(--c) 10%, transparent); }

.trackbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: var(--r-card); padding: 8px 12px; }
.trackbar .who { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.trackbar .who i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.trackbar p { margin: 0; flex: 1 1 200px; color: var(--muted); font-size: 12.5px; }

.editor { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: var(--r-card); padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.editor.muted > :not(.mutedmsg) { opacity: .35; pointer-events: none; }
.mutedmsg { display: none; color: var(--warn); font-size: 13px; }
.editor.muted .mutedmsg { display: block; }
.editor h3 { margin: 0; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.editor h3 small { color: var(--dim); font-weight: 500; }
.sect { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.card { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.card:hover { background: var(--raise); }
.card.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, var(--panel2)); }
.card b { font-size: 12.5px; display: flex; justify-content: space-between; gap: 6px; }
.card b small { color: var(--dim); font-weight: 500; }
.card span { font-size: 11px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: var(--h-sm); padding: 0 10px; border-radius: 999px; border: 1px solid var(--line2); background: var(--panel2); font-size: 12px; }
.chip:hover { background: var(--raise); }
.chip.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 22%, var(--panel2)); }
.knobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.k { display: flex; flex-direction: column; gap: 3px; }
.k label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.k label b { color: var(--text); font-variant-numeric: tabular-nums; }
.k input { width: 100%; accent-color: var(--c); }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.hint { margin: 0; font-size: 12px; color: var(--dim); }
.status { font-size: 12.5px; color: var(--muted); }
.status b { color: var(--c); }

/* étapes simples */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px; }
.inst-row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 12px; background: var(--panel2); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: var(--r-card); }
.inst-row .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.inst-row .nm { font-weight: 700; } .inst-row .nm small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 20%, var(--panel2)); font-size: 12.5px; font-weight: 600; }
.tag::after { content: "▾"; font-size: 10px; color: var(--muted); }
.inst-pick { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; }
.inst-pick .chip { border-color: var(--tc); }
.inst-pick .chip.on { background: color-mix(in srgb, var(--tc) 30%, var(--panel2)); }
.insts { display: flex; flex-direction: column; gap: 8px; }
.chgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.ch { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.ch b { font-size: 15px; } .ch small { color: var(--dim); font-size: 11px; }

@media (max-width: 1100px) { .body { grid-template-columns: 190px 170px minmax(0, 1fr); } .body.noscene { grid-template-columns: 190px minmax(0, 1fr); } .types { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .body, .body.noscene { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .steps { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .steps h6 { display: none; }
  .st { flex: none; width: auto; max-width: 190px; }
  .st > span { display: none; }
  .st i { grid-row: auto; } .st { grid-template-columns: 26px auto; }
  .scenes { flex-direction: row; overflow-x: auto; } .scenes .lbl { display: none; } .sc { flex: none; width: 140px; }
}
@media (max-width: 720px) {
  .tbox, .ghost, .keybox small { display: none; }
  .row2 { grid-template-columns: minmax(0, 1fr); }
  .types { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
/* ---- Accents de basse ---- */
.rollhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.rollhead h2 { margin: 0; font-size: 19px; } .rollhead small { color: var(--muted); font-size: 13px; }
.sel { height: var(--h); background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--r-ctl); padding: 0 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line2); background: var(--panel2); font-size: 12.5px; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc, var(--dim)); }
.pill.off { opacity: .6; }
.lbl2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.roll { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; position: relative; }
.scr { overflow-x: auto; }
.rollin { min-width: 620px; padding: 0 0 4px; position: relative; --cols: 32; }
.chordrow { display: grid; grid-template-columns: repeat(32, minmax(0, 1fr)); height: 30px; border-bottom: 1px solid var(--line); }
.chordrow b { grid-column: var(--s) / span var(--l); border-left: 1px solid var(--line2); border-bottom: 3px solid var(--cc); padding: 5px 6px 0; font-size: 13px; white-space: nowrap; overflow: hidden; }
.chordrow b.bar { border-left-color: #6a6a78; }
.notes { position: relative; margin: 0; background:
  repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / 8 - 1px), rgba(255,255,255,.07) calc(100% / 8 - 1px), rgba(255,255,255,.07) calc(100% / 8)),
  repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / 32 - 1px), rgba(255,255,255,.035) calc(100% / 32 - 1px), rgba(255,255,255,.035) calc(100% / 32)); }
.notes::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: #6a6a78; pointer-events: none; }
.rowbg { position: absolute; left: 0; right: 0; height: var(--rh); border-bottom: 1px solid rgba(255,255,255,.04); }
.rowbg.blk { background: rgba(255,255,255,.025); }
.rowbg span { position: absolute; left: 4px; top: 0; font-size: 9px; line-height: var(--rh); color: var(--dim); }
.nt { position: absolute; height: calc(var(--rh) - 3px); margin-top: 1px; border: 0; padding: 0; border-radius: 3px; background: color-mix(in srgb, var(--bass) 52%, #15301a); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bass) 60%, transparent); transition: background .12s, box-shadow .12s; min-width: 4px; }
.nt:hover { background: color-mix(in srgb, var(--bass) 75%, #15301a); }
.nt.ac { background: #9dff8f; box-shadow: 0 0 0 1px #e8ffe2, 0 0 9px 1px color-mix(in srgb, var(--bass) 80%, transparent); z-index: 2; }
.nt.ac::before { content: ""; position: absolute; left: 50%; top: -11px; width: 7px; height: 7px; border-top: 2px solid #d9ffd2; border-right: 2px solid #d9ffd2; transform: translateX(-70%) rotate(45deg); }
.nt.ac::after { content: ""; position: absolute; inset: 0; }
.accrow { border-top: 1px solid var(--line); padding: 8px 0 6px; }
.accrow .cap { display: flex; justify-content: space-between; gap: 8px; padding: 0 10px 6px; font-size: 12px; color: var(--muted); }
.accrow .cap b { color: var(--text); }
.cells { display: grid; grid-template-columns: repeat(32, minmax(0, 1fr)); }
.cell { height: 30px; border: 0; background: none; padding: 0; display: grid; place-items: center; border-left: 1px solid rgba(255,255,255,.05); position: relative; }
.cell:nth-child(4n+1) { border-left-color: rgba(255,255,255,.16); }
.cell:nth-child(16n+1) { border-left-color: #6a6a78; }
.cell:hover:not(:disabled) { background: rgba(255,255,255,.07); }
.cell:disabled { cursor: default; }
.cell .d { width: 11px; height: 11px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--bass) 70%, #000); box-sizing: border-box; }
.cell.ac .d { background: #9dff8f; border-color: #e8ffe2; box-shadow: 0 0 8px color-mix(in srgb, var(--bass) 80%, transparent); width: 13px; height: 13px; }
.cell.nonote .d { width: 3px; height: 3px; border: 0; background: var(--line2); }
.cell.echo { background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(255,255,255,.04) 4px 8px); }
.beats { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); font-size: 10px; color: var(--dim); }
.beats span { padding-left: 4px; border-left: 1px solid rgba(255,255,255,.16); } .beats span:first-child, .beats span:nth-child(5) { border-left-color: #6a6a78; }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; opacity: .0; z-index: 3; pointer-events: none; }
.playing .playhead { opacity: .8; animation: sweep 3.6s linear infinite; }
@keyframes sweep { from { left: 0; } to { left: 100%; } }
.repeat { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: var(--r-ctl); overflow: hidden; }
.seg button { height: var(--h-sm); padding: 0 10px; border: 0; border-right: 1px solid var(--line2); background: var(--panel2); font-size: 12px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: color-mix(in srgb, var(--bass) 28%, var(--panel2)); color: #fff; box-shadow: inset 0 -2px 0 var(--bass); }
.warn { color: var(--warn); }
.cardx { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cardx h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cardx h3 small { font-weight: 500; color: var(--dim); font-size: 12px; }
.cardx h3 .grow { flex: 1; }
.checkl { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; }
.checkl input { width: 16px; height: 16px; accent-color: var(--bass); }
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.mode { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mode:hover { background: var(--raise); }
.mode.on { border-color: var(--bass); background: color-mix(in srgb, var(--bass) 16%, var(--panel2)); }
.mode b { font-size: 12.5px; } .mode span { font-size: 11px; color: var(--muted); }
.mode svg { width: 100%; height: 22px; display: block; }
.accgrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; }
.pats { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 6px; }
.pat { border-radius: 999px; border-radius: 10px; text-align: left; background: var(--panel2); border: 1px solid var(--line2); padding: 6px 10px 5px; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; min-width: 0; }
.pat:hover { background: var(--raise); }
.pat.on { border-color: var(--bass); background: color-mix(in srgb, var(--bass) 20%, var(--panel2)); }
.pat svg { width: 100%; height: 16px; display: block; }
.pat small { color: var(--dim); font-size: 10.5px; }
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ctl { display: flex; align-items: center; gap: 12px; }
.ctl .txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; font-size: 13px; }
.ctl .txt b { font-size: 13px; } .ctl .txt small { color: var(--muted); font-size: 11.5px; }
.knob { width: 58px; height: 58px; flex: none; border-radius: 50%; touch-action: none; cursor: ns-resize; }
.knob.s { width: 44px; height: 44px; }
.knob svg { width: 100%; height: 100%; display: block; }
.knob:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw { width: 44px; height: 24px; border-radius: 999px; border: 1px solid var(--line2); background: var(--panel2); position: relative; flex: none; padding: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.sw[aria-checked="true"] { background: color-mix(in srgb, var(--bass) 35%, var(--panel2)); border-color: var(--bass); }
.sw[aria-checked="true"]::after { transform: translateX(20px); background: #9dff8f; }
.filt { display: flex; flex-direction: column; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); }
.filt .sub { padding-top: 10px; border-top: 1px dashed var(--line2); }
.sc .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }

function renderRoll() {
